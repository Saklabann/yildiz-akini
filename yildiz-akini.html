  addRow(374, t('m_menu'), null, { h: 46, icon: 'grid', center: true }, { act: backToMenu });
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(120,150,180,0.7)';
  ctx.font = '600 11px system-ui, sans-serif';
  ctx.fillText(t('ver_fmt'), W / 2, 462);
}
function renderOver() {
  ctx.fillStyle = 'rgba(8,4,16,0.78)'; ctx.fillRect(0, 0, W, H);
  panel(28, 84, W - 56, 560, 22, { c1: 'rgba(30,20,52,0.72)', c2: 'rgba(8,8,22,0.88)', border: 'rgba(255,110,190,0.3)' });
  UI.begin('over');
  gradText(state.timeUp ? t('time_up') : t('over_title'), W / 2, 148, '800 38px system-ui, "Segoe UI", sans-serif', '#ff9ec8', '#ffe9f4', '#ff2f7a');
  if (state.newRecord) {
    pill(W / 2 - 96, 164, 192, 26, '★ ' + t('new_record') + ' ★', '#ffe9a8',
      { fill: 'rgba(40,30,6,0.75)', border: 'rgba(255,209,102,0.55)' });
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#f2faff';
  ctx.font = '800 30px system-ui, "Segoe UI", sans-serif';
  ctx.fillText(fmt(state.score), W / 2, 234);
  pill(W / 2 - 74, 248, 148, 22, t('o_mode', { v: t('mode_' + S.gmode) }), '#9fc5dd', {});
  const acc = state.runShots ? Math.round(state.runHits / state.runShots * 100) : 0;
  const mins = Math.floor(state.runT / 60), secs = Math.floor(state.runT % 60);
  const dustG = Math.max(0, P.dustTotal - state.dust0);
  const cells = [
    [t('o_wave', { n: state.wave }), '#8fd0ff'],
    [t('o_combo', { n: state.runCombo }), '#ffd166'],
    [t('o_acc', { n: acc }), '#59e6ff'],
    [t('o_time', { n: mins + ':' + String(secs).padStart(2, '0') }), '#9d7bff'],
    [t('o_coins', { n: fmt(state.runCoins) }), '#ffd166'],
    [t('dust_fmt', { n: '+' + dustG }), '#c9e8ff']
  ];
  const cw3 = (W - 56 - 28) / 2;
  cells.forEach((c, i) => {
    const cx3 = 42 + (i % 2) * (cw3 + 10), cy3 = 288 + Math.floor(i / 2) * 56;
    panel(cx3, cy3, cw3, 48, 12, { c1: 'rgba(26,36,66,0.55)', c2: 'rgba(10,14,32,0.7)' });
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = c[1];
    ctx.font = '800 13.5px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(c[0], cx3 + cw3 / 2, cy3 + 25);
  });
  addRow(474, t('m_restart'), null, { h: 50, cta: true, icon: 'play', center: true }, { act: () => { if (state.overT > 0.8) startGame(); } });
  addRow(536, t('m_menu'), null, { h: 46, icon: 'grid', center: true }, { act: backToMenu });
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (state.prevBest > 0) {
    const dd = state.score - state.prevBest;
    ctx.fillStyle = dd >= 0 ? '#59f0a0' : '#ff9a9a';
    ctx.font = '700 11.5px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(t('ov_prev', { n: fmt(state.prevBest), d: (dd >= 0 ? '+' : '') + fmt(dd) }), W / 2, 604);
  } else {
    ctx.fillStyle = 'rgba(160,205,235,0.85)';
    ctx.font = '700 11.5px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(t('ov_first'), W / 2, 604);
  }
  ctx.fillStyle = 'rgba(159,240,255,' + (state.overT > 0.8 ? 0.5 + 0.4 * Math.sin(state.time * 4) : 0.25) + ')';
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.fillText(t('again'), W / 2, 626);
}
function renderUpgrade() {
  ctx.fillStyle = 'rgba(6,10,26,0.85)'; ctx.fillRect(0, 0, W, H);
  UI.begin('upgrade');
  gradText(t('upg_title'), W / 2, 126, '800 28px system-ui, "Segoe UI", sans-serif', '#ffe9a8', '#fff8e0', '#ffb020');
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(139,163,192,0.9)';
  ctx.font = '600 12.5px system-ui, "Segoe UI", sans-serif';
  ctx.fillText(t('upg_hint'), W / 2, 152);
  const pIcons = { dmg: 'flame', rate: 'bolt', speed: 'wind', regen: 'shield', bomb: 'bomb', magnet: 'magnet',
    combow: 'clock', combos: 'chart', dash: 'dash', life: 'heart', miss: 'rocket', drone: 'ship',
    graze: 'target', boss: 'skull', coin: 'coin', revive: 'medal' };
  const cardH = 112, gap = 18;
  let y = 178;
  state.upg.forEach((p, i) => {
    const focus = i === UI.fi;
    panel(34, y, W - 68, cardH, 16, {
      c1: focus ? 'rgba(58,74,40,0.55)' : 'rgba(24,34,62,0.55)',
      c2: focus ? 'rgba(30,40,20,0.72)' : 'rgba(10,14,32,0.75)',
      border: focus ? '#ffd166' : 'rgba(110,160,220,0.22)',
      lw: focus ? 2 : 1.2,
      glow: focus && !S.rmotion ? 'rgba(255,209,102,0.6)' : null
    });
    const icol = focus ? TH.gold : '#9fc5dd';
    ctx.beginPath(); ctx.arc(72, y + 56, 21, 0, TAU);
    ctx.fillStyle = focus ? 'rgba(255,209,102,0.16)' : 'rgba(255,255,255,0.07)';
    ctx.fill();
    ctx.strokeStyle = focus ? 'rgba(255,209,102,0.6)' : 'rgba(140,190,240,0.3)';
    ctx.lineWidth = 1.3; ctx.stroke();
    iconGlyph(72, y + 56, 11, pIcons[p.id] || 'star', icol);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = focus ? '#fff3d6' : '#dceafa';
    ctx.font = '800 17px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(t('perk_' + p.id + '_n'), 104, y + 42);
    ctx.fillStyle = 'rgba(156,186,216,0.95)';
    ctx.font = '600 12px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(t('perk_' + p.id + '_d'), 104, y + 66);
    const have = state.progs[p.id] || 0;
    for (let s2 = 0; s2 < p.max; s2++) {
      iconGlyph(112 + s2 * 20, y + 88, 6, 'star', s2 <= have ? TH.gold : 'rgba(120,150,190,0.35)');
    }
    panel(W - 78, y + 10, 26, 26, 8, { c1: 'rgba(40,58,104,0.7)', c2: 'rgba(16,24,48,0.8)' });
    ctx.fillStyle = focus ? '#ffd166' : '#9fc5dd';
    ctx.font = '800 13px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), W - 65, y + 24);
    ctx.textBaseline = 'alphabetic';
    UI.row(34, y, W - 68, cardH, { act: () => chooseUpgrade(i) });
    y += cardH + gap;
  });
}

/* ---------- girdi ---------- */
const KEYS = {};
const pointer = { x: W/2, y: H-90, last: -99, down: false };
const padPrev = {};
function canvasPos(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  KEYS[k] = true;
  if (e.repeat) return;
  if (k === 'm') { S.mute = !S.mute; saveS(); if (!S.mute) sfx.power(); return; }
  if (k === 'f') { toggleFullscreen(); return; }
  const m = state.mode;
  if (m === 'menu') {
    if (k === 'arrowup' || k === 'w') UI.move(-1);
    else if (k === 'arrowdown' || k === 's') UI.move(1);
    else if (k === 'arrowleft' || k === 'a') UI.adjust(-1);
    else if (k === 'arrowright' || k === 'd') UI.adjust(1);
    else if (k === 'enter' || k === ' ') UI.activate();
    else if (k === 'escape' && state.menuPage !== 'main') { state.menuPage = 'main'; sfx.tick(); }
  } else if (m === 'playing') {
    if (k === 'shift') doDash();
    else if (k === 'e') useAbil();
    else if (k === 'b') useBomb();
    else if (k === 'u') useUltra();
    else if (k === 'p' || k === 'escape') pauseGame();
  } else if (m === 'paused') {
    if (k === 'p' || k === 'escape' || k === ' ') resumeGame();
    else if (k === 'arrowup' || k === 'w') UI.move(-1);
    else if (k === 'arrowdown' || k === 's') UI.move(1);
    else if (k === 'enter') UI.activate();
  } else if (m === 'upgrade') {
    if (k === '1' || k === '2' || k === '3') chooseUpgrade(+k - 1);
    else if (k === 'arrowup' || k === 'arrowdown' || k === 'w' || k === 's' || k === 'arrowleft' || k === 'a') UI.move(k === 'arrowup' || k === 'w' || k === 'arrowleft' || k === 'a' ? -1 : 1);
    else if (k === 'arrowright' || k === 'd') UI.move(1);
    else if (k === 'enter' || k === ' ') UI.activate();
  } else if (m === 'over') {
    if ((k === ' ' || k === 'enter' || k === 'r') && state.overT > 0.8) startGame();
    else if (k === 'arrowup' || k === 'w') UI.move(-1);
    else if (k === 'arrowdown' || k === 's') UI.move(1);
    else if (k === 'escape') backToMenu();
  }
});
window.addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
function menuHover(x, y) {
  const m = state.mode;
  if (m === 'menu' || m === 'paused' || m === 'upgrade' || m === 'over') UI.hover(x, y);
}
canvas.addEventListener('pointermove', ev => {
  const p = canvasPos(ev);
  pointer.x = p.x; pointer.y = p.y; pointer.last = state.time;
  if (ev.pointerType === 'touch' && joy.on && ev.pointerId === joy.id) {
    const dx = p.x - joy.ox, dy = p.y - joy.oy;
    let vx = dx / 48, vy = dy / 48;
    const l = Math.hypot(vx, vy);
    if (l > 1) { vx /= l; vy /= l; }
    joy.vx = vx; joy.vy = vy;
    return;
  }
  menuHover(p.x, p.y);
});
canvas.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const p = canvasPos(ev);
  pointer.x = p.x; pointer.y = p.y; pointer.last = state.time;
  const m = state.mode;
  if (ev.pointerType === 'touch' && m === 'playing') {
    pointer.down = true;
    const btns = touchButtons();
    for (const b of btns)
      if (dist2(p.x, p.y, b.x, b.y) < b.r * b.r * 1.35) { b.act(); return; }
    if (p.x < W * 0.62 && !joy.on) {
      joy.on = true; joy.id = ev.pointerId; joy.ox = p.x; joy.oy = p.y; joy.vx = 0; joy.vy = 0;
      return;
    }
    return;
  }
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(ev.pointerId); } catch (e) {} }
  if (m === 'menu' || m === 'paused' || m === 'upgrade' || m === 'over') { UI.hit(p.x, p.y); return; }
  pointer.down = true;
});
window.addEventListener('pointerup', ev => {
  pointer.down = false;
  if (joy.on && ev.pointerId === joy.id) { joy.on = false; joy.id = -1; joy.vx = 0; joy.vy = 0; }
});
window.addEventListener('pointercancel', () => {
  pointer.down = false;
  joy.on = false; joy.vx = 0; joy.vy = 0;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  } catch (e) {}
}
/* ---------- gamepad ---------- */
function pollPad() {
  if (!navigator.getGamepads) return;
  const pad = navigator.getGamepads()[0];
  if (!pad) { padMove = null; return; }
  const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
  padMove = Math.hypot(ax, ay) > 0.2 ? { x: ax, y: ay } : null;
  const b = pad.buttons;
  const pressed = i => !!(b[i] && b[i].pressed);
  const just = i => pressed(i) && !padPrev[i];
  if (state.mode === 'playing') {
    if (just(0)) useBomb();
    if (just(1) || just(5)) doDash();
    if (just(2)) useUltra();
    if (just(9)) pauseGame();
  } else if (state.mode === 'paused') {
    if (just(9) || just(0)) resumeGame();
  } else if (state.mode === 'menu') {
    if (just(0) || just(9)) UI.activate();
    if (just(13) || just(12)) UI.move(just(13) ? -1 : 1);
  }
  for (let i = 0; i < b.length; i++) padPrev[i] = pressed(i);
}

/* ---------- ana döngü ---------- */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.033);
  state.fpsAcc += dt; state.fpsN++;
  if (state.fpsAcc >= 0.5) { state.fps = state.fpsN / state.fpsAcc; state.fpsAcc = 0; state.fpsN = 0; }
  pollPad();
  musicUpdate();
  update(dt);
  render();
  requestAnimationFrame(loop);
}
resetRun();
player = null;
requestAnimationFrame(loop);
})();
</script>
