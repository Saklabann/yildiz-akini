const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fit();
window.addEventListener('resize', fit);

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const pick = a => a[(Math.random() * a.length) | 0];
const fmt = n => { n = Math.round(n); return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, S.lang === 'en' ? ',' : '.'); };
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function t(k, p) {
  const d = DICT[S.lang] || TR;
  let s = d[k];
  if (s == null) { (window.__tmiss = window.__tmiss || []).push(k); s = TR[k] != null ? TR[k] : k; }
  if (p) s = s.replace(/\{(\w+)\}/g, (m, g) => p[g] != null ? p[g] : m);
  return s;
}

/* ---------- ses ---------- */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = false; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
const vsfx = v => S.mute ? 0 : v * S.sfx;
const vmus = v => S.mute ? 0 : v * S.music;
function toneAt(freq, dur, type, vol, slideTo, when) {
  if (vol <= 0) return; const ac = audio(); if (!ac) return;
  const t0 = when || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
const tone = (f, d, tp, v, sl) => toneAt(f, d, tp, vsfx(v), sl);
function noiseAt(dur, vol, freq, when) {
  if (vol <= 0) return; const ac = audio(); if (!ac) return;
  const t0 = when || ac.currentTime;
  const len = Math.max(1, Math.floor(ac.sampleRate * dur));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const dd = buf.getChannelData(0);
  for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t0);
  f.frequency.exponentialRampToValueAtTime(120, t0 + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(ac.destination);

const mus = { next: 0, beat: 0 };
function musicUpdate() {
  const ac = audio(); if (!ac || S.mute || S.music <= 0) return;
  const now = ac.currentTime;
  if (mus.next < now) mus.next = now + 0.05;
  const boss = state.mode === 'playing' && enemies.some(e => e.type === 'boss');
  const step = state.mode === 'menu' ? 0.32 : boss ? 0.21 : 0.27;
  let guard = 0;
  while (mus.next < now + 0.3 && guard++ < 16) {
    musicBeat(mus.beat, mus.next, boss);
    mus.beat++; mus.next += step;
  }
}
function musicBeat(b, tm, boss) {
  const root = 110, prog = [0, -2, -5, -3];
  const p = prog[Math.floor(b / 4) % 4];
  toneAt(root * Math.pow(2, p / 12), 0.24, 'triangle', vmus(0.5), null, tm);
  if (b % 2 === 0) {
    const pent = [0, 3, 5, 7, 10, 12];
    const n = pent[(b * 3 + (b >> 2)) % pent.length];
    toneAt(root * 2 * Math.pow(2, (p + n) / 12), 0.17, 'square', vmus(0.1), null, tm);
  }
  if (b % 4 === 2) noiseAt(0.04, vmus(0.4), 4500, tm);
  if (boss && b % 2 === 1) toneAt(root / 2 * Math.pow(2, p / 12), 0.2, 'sawtooth', vmus(0.3), null, tm);
}

const UI = {
  rects: [], items: [], focus: {}, ctx: 'main',
  begin(c) { this.ctx = c; this.rects = []; this.items = []; },
  get fi() { return this.focus[this.ctx] || 0; },
  set fi(v) { this.focus[this.ctx] = v; },
  row(x, y, w, h, item) {
    item.i = this.items.length; this.items.push(item);
    const i = item.i;
    this.rects.push({ x, y, w, h,
      act: () => { UI.focus[UI.ctx] = i; if (item.act) item.act(); },
      hover: () => { UI.focus[UI.ctx] = i; } });
    return item;
  },
  hit(x, y) {
    for (const r of this.rects) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { r.act(); return true; }
    return false;
  },
  hover(x, y) {
    for (const r of this.rects) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { r.hover(); return; }
  },
  activate() { const it = this.items[this.fi]; if (it && it.act) it.act(); },
  move(d) { const n = this.items.length; if (n) this.focus[this.ctx] = (this.fi + d + n) % n; },
  adjust(d) { const it = this.items[this.fi]; if (it && it.adjust) it.adjust(d); }
};

  addShake(e.type === 'boss' ? 14 : e.type === 'tank' ? 5 : 2.5);

    for (let i = 0; i < 12; i++) { q.push({ type: 'rock', t, x: rand(40, W-40) }); t += rand(0.35, 0.7) / dm.spd; }
    t = 1.5;
    for (let i = 0; i < 3; i++) { q.push({ type: 'scout', t, x: rand(55, W-55) }); t += rand(1, 2); }
    return;
  }
  let count = Math.round((3 + n * 1.5) * dm.cnt);
  while (count > 0) {
    const r = Math.random();
    if (r < 0.16 && count >= 5) {
      const cx = rand(120, W-120);
      for (let k = -2; k <= 2; k++) q.push({ type: 'scout', t, x: cx + k*50, y: -30 - Math.abs(k)*28 });
      count -= 5; t += rand(0.9, 1.3);
    } else if (r < 0.28 && count >= 3) {
      const off = rand(20, W-160);
      for (let k = 0; k < 3; k++) q.push({ type: 'diver', t: t + k*0.15, x: off + k*40 + 40 });
      count -= 3; t += rand(0.9, 1.3);
    } else {
      let type = 'scout';
      const rr = Math.random();
      if (rr < 0.22) type = 'diver';
      else if (rr < 0.40) type = 'shooter';
      else if (rr < 0.52) type = 'tank';
      else if (rr < 0.66) type = 'splitter';
      else if (rr < 0.78) type = 'orbiter';
      else if (rr < 0.90) type = 'sniper';
      else type = 'mine';
      if (n < 2) type = 'scout';
      else if (n < 3 && (type === 'sniper' || type === 'tank' || type === 'orbiter')) type = 'shooter';
      else if (n < 4 && (type === 'sniper' || type === 'mine')) type = 'splitter';
      q.push({ type, t, x: rand(55, W-55), elite: Math.random() < 0.08 + Math.min(0.2, n*0.012) });
      count--; t += Math.max(0.22, rand(0.45, 0.95) - n*0.02);
    }
  }
}
function nextWave() {

/* ---------- oyuncu güncelleme ---------- */
function fireWeapon(gdt) {
  const p = player;
  p.cool -= gdt;
  if (p.cool > 0) return;
  p.cool = st.fireCd * st.rateMul * (p.rapid > 0 ? 0.6 : 1);
  const spd = st.bulletSp, dmg = st.dmg;
  const mk = (dx, dy, vx) => {
    bullets.push({ x: p.x + dx, y: p.y + dy, vx: vx || 0, vy: -spd, r: 3, dmg, c: st.color, dead: false });
    state.runShots++; P.shots++;
  };
  if (p.weapon === 1) mk(0, -16, 0);
  else if (p.weapon === 2) { mk(-7, -12, 0); mk(7, -12, 0); }
  else { mk(0, -18, 0); mk(-9, -10, -110); mk(9, -10, 110); }
  p.muzzle = 0.06;
  if (Math.random() < 0.4) sfx.shoot();
}
function nearestEnemy(x, y) {
  let best = null, bd = Infinity;
  for (const e of enemies) { if (e.dead) continue; const d = dist2(x, y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
  return best;
}
function updateMissiles(gdt) {
  const p = player;
  if (p.missiles <= 0) return;
  p.missiles -= gdt;
  p.missileT = (p.missileT || 0) - gdt;
  if (p.missileT > 0) return;
  p.missileT = 0.55;
  const side = p.missileSide = -p.missileSide;
  missiles.push({ x: p.x + side*14, y: p.y - 6, vx: side*60, vy: -260, r: 5, t: 0, dead: false });
}
function updateLaser(gdt) {
  const p = player;
  if (p.laser <= 0) return;
  p.laser -= gdt;
  const dps = 9 * st.dmg * st.bossDmg;
  let hitAny = false;
  for (const e of enemies) {
    if (e.dead || e.y > p.y) continue;
    if (Math.abs(e.x - p.x) < e.r + 10) { hurtEnemy(e, dps * gdt, e.x, p.y - 40); hitAny = true; }
  }
  for (const r of rocks)
    if (!r.dead && Math.abs(r.x - p.x) < r.r + 10 && r.y < p.y) hurtRock(r, dps * gdt);
  p.laserTick -= gdt;
  if (p.laserTick <= 0) { p.laserTick = 0.12; tone(1200, 0.05, 'sawtooth', 0.02, 700); }
  if (hitAny && Math.random() < 0.5) spark(p.x + rand(-8,8), p.y - rand(60, 200), '#ff9be0');
}
function updateDrones(gdt) {
  const p = player;
  if (p.drones <= 0) return;
  p.drones -= gdt;
  p.droneA += gdt * 2.6;
  for (let k = 0; k < 2; k++) {
    const a = p.droneA + k * Math.PI;
    const dx = p.x + Math.cos(a) * 38, dy = p.y + Math.sin(a) * 38;
    p['droneT' + k] = (p['droneT' + k] || 0) - gdt;
    if (p['droneT' + k] > 0) continue;
    p['droneT' + k] = 0.5;
    const tgt = nearestEnemy(dx, dy);
    if (!tgt) continue;
    const ang = Math.atan2(tgt.y - dy, tgt.x - dx);
    bullets.push({ x: dx, y: dy, vx: Math.cos(ang)*520, vy: Math.sin(ang)*520, r: 2.5,
      dmg: Math.max(1, st.dmg - 1), c: CC.drone, dead: false });
  }
}
function useBomb() {
  if (state.mode !== 'playing' || state.bombs <= 0 || state.bombCd > 0 || !player) return;
  state.bombs--; state.bombCd = 0.9;
  flash(0.5, '#cfefff');
  sfx.bomb(); addShake(14);
  fxRing(player.x, player.y, 26, 900, 12, 0.55, '#cfefff');
  fxRing(player.x, player.y, 10, 520, 5, 0.75, '#ffffff');
  for (const e of enemies) if (!e.dead) hurtEnemy(e, 8 * st.bossDmg, e.x, e.y);
  for (const r of rocks) if (!r.dead) hurtRock(r, 8);
  for (const b of ebullets) { b.dead = true; spark(b.x, b.y, '#fff'); }
  for (const m of emissiles) { m.dead = true; spark(m.x, m.y, '#fff'); }
  player.inv = Math.max(player.inv, 0.5);
  addFloat(player.x, player.y - 30, t('p_bomb'), '#ffcf5f');
}
function doDash() {
  const p = player;
  if (!p || state.mode !== 'playing' || p.dashT > 0) return;
  p.dashT = st.dashCd;
  const d = p.lastDir;
  p.dvx = d.x * 900; p.dvy = d.y * 900;
  p.inv = Math.max(p.inv, 0.4);
  p.dashFx = 0.25;
  sfx.dash();
}
function updatePlayer(gdt) {
  const p = player;
  if (p.inv > 0) p.inv -= gdt;
  if (p.shield > 0) p.shield -= gdt;
  if (p.rapid > 0) p.rapid -= gdt;
  if (p.magnet > 0) p.magnet -= gdt;
  if (p.dashT > 0) p.dashT -= gdt;
  if (p.muzzle > 0) p.muzzle -= gdt;
  if (p.dashFx > 0) p.dashFx -= gdt;
  if (st.shieldRegen > 0) {
    if (p.shield <= 0) {
      state.regenT -= gdt;
      if (state.regenT <= 0) {
        p.shield = 8; state.regenT = st.shieldRegen;
        addFloat(p.x, p.y - 26, t('p_shield'), CC.shield);
        sfx.power();
      }
    } else state.regenT = st.shieldRegen;
  }
  const kx = (KEYS['arrowright'] || KEYS['d'] ? 1 : 0) - (KEYS['arrowleft'] || KEYS['a'] ? 1 : 0);
  const ky = (KEYS['arrowdown'] || KEYS['s'] ? 1 : 0) - (KEYS['arrowup'] || KEYS['w'] ? 1 : 0);
  let ax = 0, ay = 0, analog = false;
  if (kx || ky) { const l = Math.hypot(kx, ky); ax = kx/l; ay = ky/l; }
  else if (joy.on) { ax = joy.vx; ay = joy.vy; analog = true; }
  else if (padMove) { ax = padMove.x; ay = padMove.y; analog = true; }
  const mag = Math.hypot(ax, ay);
  if (mag > 0.05) {
    const sp = st.speed * st.speedMul;
    p.x += ax * sp * gdt; p.y += ay * sp * gdt;
    p.tilt = clamp(p.tilt + ax * gdt * 4, -1, 1);
    const l = mag || 1;
    p.lastDir = { x: ax/l, y: ay/l };
  } else if (!analog && ((state.time - pointer.last < 1.2) || pointer.down)) {
    const dx = pointer.x - p.x, dy = pointer.y - p.y, d = Math.hypot(dx, dy);
    if (d > 2) {
      const sp = Math.min(480, d * 10);
      p.x += (dx/d) * sp * gdt; p.y += (dy/d) * sp * gdt;
      p.tilt = clamp(p.tilt + (dx/Math.max(d,1)) * gdt * 4, -1, 1);
      p.lastDir = { x: dx/d, y: dy/d };
    }
  } else p.tilt *= Math.exp(-6 * gdt);
  p.x += p.dvx * gdt; p.y += p.dvy * gdt;
  const dk = Math.exp(-7 * gdt);
  p.dvx *= dk; p.dvy *= dk;
  p.x = clamp(p.x, 18, W - 18);
  p.y = clamp(p.y, 40, H - 30);
  if (p.dashFx > 0 || p.inv > 1.9) {
    p.afterT = (p.afterT || 0) - gdt;
    if (p.afterT <= 0) { p.afterT = 0.045; afterimages.push({ x: p.x, y: p.y, tilt: p.tilt, life: 0.3, max: 0.3 }); }
  }
  fireWeapon(gdt);
  updateMissiles(gdt);
  updateLaser(gdt);
  updateDrones(gdt);
}

/* ---------- düşman güncelleme ---------- */
function aimedShot(src, spd, spread, count, offY, col) {
  const a0 = Math.atan2(player.y - src.y, player.x - src.x);
  for (let k = 0; k < count; k++) {
    const a = a0 + (k - (count - 1) / 2) * spread;
    ebullets.push({ x: src.x, y: src.y + (offY || 0), vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      r: 5, color: col || CC.eb, g: false, dead: false });
  }
}
function radialShot(x, y, n, spd, a0, r, col) {
  for (let k = 0; k < n; k++) {
    const a = a0 + (k / n) * TAU;
    ebullets.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r: r || 5, color: col || CC.eb, g: false, dead: false });
  }
}
function explodeMine(e) {
  e.dead = true;
  radialShot(e.x, e.y, 8, 180, 0, 5, CC.mine);
  explodeAt(e.x, e.y, 16, '#ff9a6b');
  fxRing(e.x, e.y, 8, 400, 4, 0.4, CC.mine);
  sfx.boom(); addShake(4);
  if (player && dist2(e.x, e.y, player.x, player.y) < 60*60) damagePlayer();
}
function updateEnemies(gdt) {
  const dm = DIFF[S.diff], p = player;
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += gdt;
    if (e.flash > 0) e.flash -= gdt;
    if (e.inv > 0) e.inv -= gdt;
    if (e.type === 'scout') { e.y += e.vy*gdt; e.x = e.x0 + Math.sin(e.t*2.2 + e.seed)*e.amp; }
    else if (e.type === 'diver') {
      e.vx += clamp(p.x - e.x, -1, 1) * 70 * gdt;
      e.vx = clamp(e.vx, -230, 230);
      e.x += e.vx*gdt; e.y += e.vy*gdt;
    }
    else if (e.type === 'splitter' || e.type === 'splitling') e.y += e.vy*gdt;
    else if (e.type === 'shooter') {
      if (e.y < e.stopY) e.y += e.vy*gdt;
      else { e.x += e.dir*80*gdt; if (e.x < 40) { e.x = 40; e.dir = 1; } if (e.x > W-40) { e.x = W-40; e.dir = -1; } }
      e.fireT -= gdt;
      if (e.fireT <= 0 && e.y > 0) {
        e.fireT = Math.max(0.7, rand(1.1, 1.7) - state.wave*0.03);
        aimedShot(e, (170 + state.wave*3) * dm.spd, 0, 1, 16);
        sfx.eshoot();
      }
    }
    else if (e.type === 'tank') {
      if (e.y < e.stopY) e.y += e.vy*gdt;
      else { e.x += e.dir*50*gdt; if (e.x < 45) { e.x = 45; e.dir = 1; } if (e.x > W-45) { e.x = W-45; e.dir = -1; } }
      e.fireT -= gdt;
      if (e.fireT <= 0 && e.y > 0) {
        e.fireT = rand(1.6, 2.2);
        for (let k = -1; k <= 1; k++)
          ebullets.push({ x: e.x + k*16, y: e.y + 22, vx: k*70*dm.spd, vy: 185*dm.spd, r: 6, color: CC.diver, g: false, dead: false });
        sfx.eshoot();
      }
    }
    else if (e.type === 'orbiter') {
      e.ang += e.ospd * gdt;
      e.x = e.cx + Math.cos(e.ang)*e.rad;
      e.y = e.cy + Math.sin(e.ang)*e.rad*0.55;
      e.fireT -= gdt;
      if (e.fireT <= 0) { e.fireT = Math.max(0.9, 1.7 - state.wave*0.03); aimedShot(e, 190*dm.spd, 0.18, 3, 0, CC.orbiter); sfx.eshoot(); }
    }
    else if (e.type === 'sniper') {
      if (e.phase === 'desc') { e.y += e.vy*gdt; if (e.y >= e.stopY) e.phase = 'idle'; }
      else if (e.phase === 'idle') {
        e.fireT -= gdt;
        if (e.fireT <= 0) { e.phase = 'warn'; e.warnT = 0.7; }
      } else if (e.phase === 'warn') {
        e.warnT -= gdt;
        if (p) { e.ax = p.x; e.ay = p.y; }
        if (e.warnT <= 0) {
          e.phase = 'idle'; e.fireT = Math.max(1.4, 2.6 - state.wave*0.05);
          const a = Math.atan2(p.y - e.y, p.x - e.x);
          ebullets.push({ x: e.x, y: e.y + 14, vx: Math.cos(a)*480*dm.spd, vy: Math.sin(a)*480*dm.spd,
            r: 4, color: CC.sniper, g: false, dead: false });
          fxRing(e.x, e.y + 14, 4, 200, 2, 0.25, CC.sniper);
          sfx.eshoot();
        }
      }
    }
    else if (e.type === 'mine') {
      e.y += e.vy*gdt;
      if (p && dist2(e.x, e.y, p.x, p.y) < 95*95) { explodeMine(e); continue; }
    }
    else if (e.type === 'boss') updateBoss(e, gdt);
    if (e.type !== 'boss' && e.y > H + 70) e.dead = true;
    if (e.type === 'diver' && (e.x < -60 || e.x > W + 60)) e.dead = true;
  }
}
function updateBoss(b, gdt) {
  const p = player, dm = DIFF[S.diff];
  if (!b.entered) {
    b.y += 90*gdt;
    if (b.y >= 112) { b.y = 112; b.entered = true; b.fireT = 1.2; }
    return;
  }
  b.x += b.vx*gdt;
  if (b.x < 82) { b.x = 82; b.vx = Math.abs(b.vx); }
  if (b.x > W-82) { b.x = W-82; b.vx = -Math.abs(b.vx); }
  if (b.phase === 1 && b.hp < b.maxhp*0.5) {
    b.phase = 2; b.inv = 2; b.vx = Math.sign(b.vx || 1) * 120;
    addFloat(b.x, b.y - 40, t('phase2'), '#ff9ecf');
    fxRing(b.x, b.y, 20, 500, 6, 0.7, '#ff9ecf');
    flash(0.2, '#ff4f9a'); sfx.siren();
  }
  if (!p) return;
  b.fireT -= gdt * (b.phase === 2 ? 1.6 : 1);
  if (b.fireT > 0) return;
  if (b.btype === 0) {
    b.fireT = rand(0.8, 1.3);
    b.pat = (b.pat + 1) % 2;
    if (b.pat === 0) radialShot(b.x, b.y + 34, 5, 170*dm.spd, Math.PI/2 - 0.4, 6, '#ff5fa8');
    else aimedShot({ x: b.x, y: b.y + 30 }, 220*dm.spd, 0.15, 3, 0, '#ffc45f');
  } else if (b.btype === 1) {
    b.fireT = rand(1.1, 1.5);
    b.pat = (b.pat + 1) % 2;
    if (b.pat === 0) { beams.push({ x: b.x, w: 30, phase: 'warn', t: 0.9, hitDone: false, src: b, dead: false }); sfx.siren(); }
    else aimedShot({ x: b.x, y: b.y + 30 }, 230*dm.spd, 0.2, 5, 0, '#ffc45f');
  } else {
    b.fireT = rand(1.2, 1.7);
    b.pat = (b.pat + 1) % 3;
    if (b.pat === 0) {
      for (let k = -1; k <= 1; k += 2)
        emissiles.push({ x: b.x + k*34, y: b.y + 20, vx: k*40, vy: 60, t: 0, hp: 1, r: 6, dead: false });
    } else if (b.pat === 1) aimedShot({ x: b.x, y: b.y + 30 }, 210*dm.spd, 0.25, 3, 0, '#ffc45f');
    else radialShot(b.x, b.y, 12, 130*dm.spd, b.t, 5, '#ff5fa8');
  }
  sfx.eshoot();
}
function updateBeams(gdt) {
  for (const b of beams) {
    if (b.dead) continue;
    b.t -= gdt;
    if (b.src && !b.src.dead) b.x = b.src.x;
    if (b.phase === 'warn' && b.t <= 0) { b.phase = 'fire'; b.t = 0.6; flash(0.15, '#ff3050'); sfx.bomb(); }
    else if (b.phase === 'fire') {
      if (!b.hitDone && player && Math.abs(player.x - b.x) < b.w/2 + 8 && player.y > (b.src ? b.src.y + 20 : 0)) {
        b.hitDone = true; damagePlayer();
      }
      if (b.t <= 0) b.dead = true;
    }
  }
}
function updateRocks(gdt) {
  for (const r of rocks) {
    if (r.dead) continue;
    r.y += r.vy*gdt; r.rot += r.vr*gdt;
    if (r.flash > 0) r.flash -= gdt;
    if (r.y > H + 50) r.dead = true;
  }
}
function updateUfo(gdt) {
  if (!ufo) {
    state.ufoTimer -= gdt;
    if (state.ufoTimer <= 0 && state.wave >= 4) { ufo = mkUfo(); state.ufoTimer = rand(40, 60); }
    return;
  }
  ufo.t += gdt;
  ufo.x += ufo.vx*gdt;
  if (ufo.flash > 0) ufo.flash -= gdt;
  if (ufo.x < -80 || ufo.x > W + 80) ufo = null;
}
function updateEnemyMissiles(gdt) {
  const p = player;
  for (const m of emissiles) {
    if (m.dead) continue;
    m.t += gdt;
    if (m.t > 7) { m.dead = true; continue; }
    if (p) {
      const spd = Math.max(140, Math.hypot(m.vx, m.vy));
      const cur = Math.atan2(m.vy, m.vx);
      const want = Math.atan2(p.y - m.y, p.x - m.x);
      let d = want - cur;
      while (d > Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      const na = cur + clamp(d, -2.2*gdt, 2.2*gdt);
      m.vx = Math.cos(na)*spd; m.vy = Math.sin(na)*spd;
    }
    m.x += m.vx*gdt; m.y += m.vy*gdt;
    if (m.x < -40 || m.x > W+40 || m.y < -40 || m.y > H+40) m.dead = true;
    if (Math.random() < 0.3) pushP({ x: m.x, y: m.y, vx: rand(-20,20), vy: rand(-20,20), life: 0.3, max: 0.3, size: 2.5, color: '#ff9e6b' });
  }
}

/* ---------- çarpışmalar ---------- */
function killEmissile(m, byPlayer) {
  m.dead = true;
  if (byPlayer) { onKillScore(50); addFloat(m.x, m.y, '+50', '#ff9e6b'); }
  explodeAt(m.x, m.y, 10, '#ff9e6b');
  sfx.hit();
}
function collideBullets(gdt) {
  const p = player;
  for (const b of bullets) {
    if (b.dead) continue;
    b.x += b.vx*gdt; b.y += b.vy*gdt;
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) { b.dead = true; continue; }
    let hit = false;
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = (e.type === 'boss' ? 44 : e.r) + b.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr*rr) { state.runHits++; P.hits++; hurtEnemy(e, b.dmg, b.x, b.y); hit = true; break; }
    }
    if (!hit) for (const r of rocks) {
      if (r.dead) continue;
      const rr = r.r + b.r;
      if (dist2(b.x, b.y, r.x, r.y) < rr*rr) { state.runHits++; P.hits++; hurtRock(r, b.dmg); hit = true; break; }
    }
    if (!hit && ufo && dist2(b.x, b.y, ufo.x, ufo.y) < (ufo.r + b.r)*(ufo.r + b.r)) {
      state.runHits++; P.hits++;
      ufo.hp -= b.dmg; ufo.flash = 0.12;
      if (ufo.hp <= 0) { killUfo(ufo); ufo = null; } else sfx.hit();
      hit = true;
    }
    if (!hit) for (const m of emissiles) {
      if (m.dead) continue;
      if (dist2(b.x, b.y, m.x, m.y) < (m.r + b.r)*(m.r + b.r)) { state.runHits++; P.hits++; killEmissile(m, true); hit = true; break; }
    }
    if (hit) b.dead = true;
  }
  // oyuncu güdümlü füzeleri
  for (const m of missiles) {
    if (m.dead) continue;
    m.t += gdt;
    if (m.t > 5) { m.dead = true; continue; }
    const tgt = nearestEnemy(m.x, m.y);
    const spd = Math.min(620, 300 + m.t * 500);
    let ang = Math.atan2(m.vy, m.vx);
    if (tgt) {
      const want = Math.atan2(tgt.y - m.y, tgt.x - m.x);
      let d = want - ang;
      while (d > Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      ang += clamp(d, -7*gdt, 7*gdt);
    }
    m.vx = Math.cos(ang)*spd; m.vy = Math.sin(ang)*spd;
    m.x += m.vx*gdt; m.y += m.vy*gdt;
    if (Math.random() < 0.7) pushP({ x: m.x - m.vx*0.02, y: m.y - m.vy*0.02, vx: rand(-15,15), vy: rand(-15,15), life: 0.25, max: 0.25, size: 2.5, color: '#ffb890' });
    if (m.y < -30 || m.y > H + 30 || m.x < -30 || m.x > W + 30) { m.dead = true; continue; }
    let hitted = false;
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = (e.type === 'boss' ? 44 : e.r) + m.r;
      if (dist2(m.x, m.y, e.x, e.y) < rr*rr) {
        hurtEnemy(e, 3 * st.dmg * st.bossDmg, m.x, m.y);
        explodeAt(m.x, m.y, 12, '#ffb890'); fxRing(m.x, m.y, 5, 260, 3, 0.3, '#ffb890');
        hitted = true; break;
      }
    }
    if (!hitted) for (const r of rocks) {
      if (r.dead) continue;
      const rr = r.r + m.r;
      if (dist2(m.x, m.y, r.x, r.y) < rr*rr) { hurtRock(r, 3*st.dmg); hitted = true; break; }
    }
    if (!hitted && ufo && dist2(m.x, m.y, ufo.x, ufo.y) < (ufo.r + m.r)*(ufo.r + m.r)) {
      ufo.hp -= 4; ufo.flash = 0.12;
      if (ufo.hp <= 0) { killUfo(ufo); ufo = null; }
      hitted = true;
    }
    if (hitted) m.dead = true;
  }
  // düşman mermileri & sıyırma
  for (const b of ebullets) {
    if (b.dead) continue;
    b.x += b.vx*gdt; b.y += b.vy*gdt;
    if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) { b.dead = true; continue; }
    if (!p) continue;
    const d2p = dist2(b.x, b.y, p.x, p.y);
    const gr = st.grazeR + 8;
    if (!b.g && d2p < gr*gr && d2p > (b.r + p.r)*(b.r + p.r)) {
      b.g = true;
      addScore(2 * st.graze);
      spark(b.x, b.y, '#aee6ff');
      p.grazeTick -= gdt;
      if (p.grazeTick <= 0) { p.grazeTick = 0.09; sfx.tick(); }
    }
    if (d2p < (b.r + p.r)*(b.r + p.r)) { b.dead = true; damagePlayer(); }
  }
  if (p) for (const m of emissiles) {
    if (m.dead) continue;
    if (dist2(m.x, m.y, p.x, p.y) < (m.r + p.r)*(m.r + p.r)) { killEmissile(m, false); damagePlayer(); }
  }
  // gövde çarpışmaları
  if (p) {
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = (e.type === 'boss' ? 44 : e.r) + p.r;
      if (dist2(e.x, e.y, p.x, p.y) < rr*rr) {
        damagePlayer();
        if (e.type !== 'boss') hurtEnemy(e, 2, e.x, e.y);
      }
    }
    for (const r of rocks) {
      if (r.dead) continue;
      const rr = r.r + p.r - 4;
      if (dist2(r.x, r.y, p.x, p.y) < rr*rr) { damagePlayer(); hurtRock(r, 2); }
    }
  }
}
function collidePickups(gdt) {
  const p = player;
  if (!p) return;
  const magR = 90 + st.magnet + (p.magnet > 0 ? 260 : 0);
  for (const pu of powerups) {
    if (pu.dead) continue;
    pu.t += gdt; pu.y += pu.vy*gdt;
    if (pu.y > H + 30) { pu.dead = true; continue; }
    const d = dist2(pu.x, pu.y, p.x, p.y);
    if (d < magR*magR) {
      const dd = Math.sqrt(d) || 1;
      pu.x += (p.x - pu.x)/dd * 260 * gdt;
      pu.y += (p.y - pu.y)/dd * 260 * gdt;
    }
    if (d < (pu.r + p.r + 4)*(pu.r + p.r + 4)) { pu.dead = true; givePower(pu.kind, pu.x, pu.y); }
  }
  for (const c of coins) {
    if (c.dead) continue;
    c.t += gdt;
    c.vy = Math.min(c.vy + 40*gdt, 90);
    c.x += c.vx*gdt; c.y += c.vy*gdt;
    c.vx *= Math.exp(-1.5*gdt);
    if (c.y > H + 20) { c.dead = true; continue; }
    const d = dist2(c.x, c.y, p.x, p.y);
    if (d < magR*magR) {
      const dd = Math.sqrt(d) || 1;
      c.x += (p.x - c.x)/dd * 330 * gdt;
      c.y += (p.y - c.y)/dd * 330 * gdt;
    }
    if (d < 26*26) { c.dead = true; addCoins(1); addScore(5); sfx.coin(); spark(c.x, c.y, CC.coin); }
  }
  for (const c of crates) {
    if (c.dead) continue;
    c.t += gdt; c.y += c.vy*gdt;
    if (c.y > H + 30) { c.dead = true; continue; }
    const d = dist2(c.x, c.y, p.x, p.y);
    if (d < magR*magR) {
      const dd = Math.sqrt(d) || 1;
      c.x += (p.x - c.x)/dd * 300 * gdt;
      c.y += (p.y - c.y)/dd * 300 * gdt;
    }
    if (d < (c.r + p.r + 6)*(c.r + p.r + 6)) { c.dead = true; giveCrate(c); }
  }
}
function filterDead() {
  enemies = enemies.filter(e => !e.dead);
  bullets = bullets.filter(b => !b.dead);
  ebullets = ebullets.filter(b => !b.dead);
  emissiles = emissiles.filter(m => !m.dead);
  missiles = missiles.filter(m => !m.dead);
  beams = beams.filter(b => !b.dead);
  rocks = rocks.filter(r => !r.dead);
  powerups = powerups.filter(p => !p.dead);
  coins = coins.filter(c => !c.dead);
  crates = crates.filter(c => !c.dead);
}

/* ---------- efekt güncellemeleri ---------- */
function updateStars(dt) {
  for (const s of stars) {
    s.y += (26 + 120 * s.z) * dt * (state.mode === 'playing' ? 1.35 : 0.6);
    if (s.y > H + 2) { s.y = -2; s.x = rand(0, W); }
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx*dt; q.y += q.vy*dt;
    const dr = Math.exp(-2.6*dt);
    q.vx *= dr; q.vy *= dr;
    q.life -= dt;
    if (q.life <= 0) particles.splice(i, 1);
  }
}
function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += r.vr*dt; r.life -= dt;
    if (r.life <= 0) rings.splice(i, 1);
  }
}
function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.x += d.vx*dt; d.y += d.vy*dt;
    d.vy += 160*dt;
    d.rot += d.vr*dt;
    d.life -= dt;
    if (d.life <= 0) debris.splice(i, 1);
  }
}
function updateAfterimages(dt) {
  for (let i = afterimages.length - 1; i >= 0; i--) {
    afterimages[i].life -= dt;
    if (afterimages[i].life <= 0) afterimages.splice(i, 1);
  }
}
function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 34*dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
}
function updateToasts(dt) {
  for (let i = state.toasts.length - 1; i >= 0; i--) {
    state.toasts[i].life -= dt;
    if (state.toasts[i].life <= 0) state.toasts.splice(i, 1);
  }
}
function updateComets(dt) {
  state.cometT -= dt;
  if (state.cometT <= 0) {
    state.cometT = rand(7, 16);
    const spd = rand(500, 800), a = rand(0.35, 0.9) * (Math.random() < 0.5 ? 1 : -1);
    comets.push({ x: rand(0, W), y: -20, vx: Math.sin(a)*spd*0.6, vy: Math.cos(a)*spd, life: 1.4, max: 1.4 });
  }
  for (let i = comets.length - 1; i >= 0; i--) {
    const c = comets[i];
    c.x += c.vx*dt; c.y += c.vy*dt; c.life -= dt;
    if (c.life <= 0 || c.y > H + 40) comets.splice(i, 1);
  }
}

/* ---------- ana güncelleme ---------- */
function update(dt) {
  state.time += dt;
  updateStars(dt);
  updateParticles(dt);
  updateRings(dt);
  updateDebris(dt);
  updateAfterimages(dt);
  updateFloats(dt);
  updateToasts(dt);
  updateComets(dt);
  state.shake *= Math.exp(-7*dt);
  if (state.shake < 0.12) state.shake = 0;
  if (state.flashA > 0) state.flashA = Math.max(0, state.flashA - dt*2.2);
  if (state.slowT > 0) state.slowT -= dt;
  if (state.zoomT > 0) state.zoomT -= dt;
  if (state.mode === 'over') state.overT += dt;

  if (state.mode !== 'playing') return;

  const ts = state.slowT > 0 ? 1 - (1 - state.slowScale) * Math.min(1, state.slowT / 0.3) : 1;
  const g = dt * ts;
  state.runT += dt;
  P.playtime += dt;
  if (state.waveBanner > 0) state.waveBanner -= dt;
  if (state.clearT > 0) state.clearT -= dt;
  if (state.comboT > 0) { state.comboT -= g; if (state.comboT <= 0) state.combo = 0; }
  if (state.bombCd > 0) state.bombCd -= g;

  updatePlayer(g);
  updateEnemies(g);
  updateRocks(g);
  updateUfo(g);
  updateBeams(g);
  updateEnemyMissiles(g);
  collideBullets(g);
  collidePickups(g);
  filterDead();

  if (state.betweenWaves > 0) {
    state.betweenWaves -= dt;
    if (state.betweenWaves <= 0) {
      if (state.upgradesPending) openUpgrades();
      else nextWave();
    }
  } else {
    state.spawnTimer += dt;
    while (state.spawnQueue.length && state.spawnQueue[0].t <= state.spawnTimer)
      spawnSpec(state.spawnQueue.shift());
    if (!state.spawnQueue.length && !enemies.length && !rocks.length && !state.waveDone) waveClear();
  }
}

/* ---------- ekran kaplamaları (önbellek) ---------- */
let vinC = null, redC = null, scanP = null;
function buildOverlays() {
  vinC = document.createElement('canvas'); vinC.width = W; vinC.height = H;
  let g2 = vinC.getContext('2d');
  let rg = g2.createRadialGradient(W/2, H/2, H*0.34, W/2, H/2, H*0.72);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g2.fillStyle = rg; g2.fillRect(0, 0, W, H);
  redC = document.createElement('canvas'); redC.width = W; redC.height = H;
  g2 = redC.getContext('2d');
  rg = g2.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.7);
  rg.addColorStop(0, 'rgba(255,0,60,0)'); rg.addColorStop(1, 'rgba(255,0,60,0.5)');
  g2.fillStyle = rg; g2.fillRect(0, 0, W, H);
  const sc = document.createElement('canvas'); sc.width = 1; sc.height = 4;
  const s2 = sc.getContext('2d');
  s2.fillStyle = 'rgba(0,0,0,0.55)'; s2.fillRect(0, 0, 1, 2);
  scanP = ctx.createPattern(sc, 'repeat');
}
buildOverlays();

/* ---------- çizim: arka plan ---------- */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070d22'); g.addColorStop(0.6, '#04060f'); g.addColorStop(1, '#090418');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  let n = ctx.createRadialGradient(W*0.2, H*0.25, 10, W*0.2, H*0.25, 260);
  n.addColorStop(0, 'rgba(40,80,200,0.14)'); n.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = n; ctx.fillRect(0, 0, W, H);
  n = ctx.createRadialGradient(W*0.85, H*0.7, 10, W*0.85, H*0.7, 240);
  n.addColorStop(0, 'rgba(140,40,160,0.12)'); n.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = n; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  for (const s of stars) {
    ctx.fillStyle = 'rgba(200,230,255,' + (0.25 + s.z*0.6) + ')';
    ctx.fillRect(s.x, s.y, s.z*1.8, s.z*1.8 + 1);
  }
  for (const c of comets) {
    const a = clamp(c.life/c.max, 0, 1) * 0.8;
    ctx.strokeStyle = 'rgba(190,230,255,' + a + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x - c.vx*0.09, c.y - c.vy*0.09);
    ctx.stroke();
  }
}

/* ---------- çizim: gemi / düşmanlar ---------- */
function drawShip(x, y, tilt, color, thrust, shieldA) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt * 0.22);
  if (thrust) {
    const fl = 7 + Math.random()*9;
    ctx.fillStyle = 'rgba(110,215,255,0.75)';
    ctx.beginPath(); ctx.moveTo(-5, 13); ctx.lineTo(0, 13 + fl); ctx.lineTo(5, 13); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(10, 5); ctx.lineTo(6, 13); ctx.lineTo(-6, 13); ctx.lineTo(-10, 5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(20,80,140,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-9, 3); ctx.lineTo(9, 3); ctx.stroke();
  ctx.fillStyle = '#0a6cff'; circle(0, -5, 3.4);
  ctx.restore();
  if (shieldA > 0) {
    ctx.strokeStyle = 'rgba(89,240,160,' + shieldA + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, 24, 0, TAU); ctx.stroke();
  }
}
function drawPlayer() {
  const p = player;
  if (!p) return;
  if (state.lives <= 0 && state.mode === 'over') return;
  if (p.inv > 0 && p.inv < 1.9 && Math.floor(state.time*12) % 2 === 0) return;
  for (const a of afterimages) {
    ctx.globalAlpha = clamp(a.life/a.max, 0, 1) * 0.35;
    drawShip(a.x, a.y, a.tilt, st.color, false, 0);
  }
  ctx.globalAlpha = 1;
  const shA = p.shield > 0 ? 0.45 + 0.25*Math.sin(state.time*6) : 0;
  drawShip(p.x, p.y, p.tilt, st.color, true, shA);
  if (p.muzzle > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(200,245,255,0.8)';
    circle(p.x, p.y - 18, 4 + Math.random()*3);
    ctx.restore();
  }
  if (p.dashT > 0) {
    const prog = 1 - p.dashT / st.dashCd;
    ctx.strokeStyle = 'rgba(159,240,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 20, -Math.PI/2, -Math.PI/2 + TAU*prog); ctx.stroke();
  }
  if (p.laser > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createLinearGradient(0, 0, 0, p.y);
    grad.addColorStop(0, 'rgba(255,107,208,0)');
    grad.addColorStop(0.7, 'rgba(255,107,208,0.55)');
    grad.addColorStop(1, 'rgba(255,190,240,0.9)');
    ctx.fillStyle = grad;
    const w = 9 + Math.sin(state.time*40)*2;
    ctx.fillRect(p.x - w/2, 0, w, p.y - 10);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(p.x - 1.5, 0, 3, p.y - 12);
    ctx.restore();
  }
}
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.elite) {
    ctx.strokeStyle = 'rgba(255,216,95,0.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.r + 8, 0, TAU); ctx.stroke();
  }
  const col = e.flash > 0 ? '#ffffff' : (CC[e.type] || '#ff4f9a');
  if (e.type === 'scout') {
    ctx.rotate(Math.sin(e.t*2.2 + (e.seed || 0))*0.12);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(14,-12); ctx.lineTo(0,-4); ctx.lineTo(-14,-12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd7ec'; circle(0, 5, 2.6);
  } else if (e.type === 'diver') {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0,18); ctx.lineTo(11,-10); ctx.lineTo(0,-2); ctx.lineTo(-11,-10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff3d9'; circle(0, 7, 2.2);
  } else if (e.type === 'shooter') {
    ctx.fillStyle = col;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i/6*TAU + Math.PI/6;
      const px = Math.cos(a)*15, py = Math.sin(a)*15;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e2ccff'; circle(0, 0, 5);
    ctx.fillStyle = '#5f2f9e'; ctx.fillRect(-3, 14, 6, 8);
  } else if (e.type === 'tank') {
    ctx.fillStyle = col;
    roundRect(-20, -16, 40, 34, 8); ctx.fill();
    ctx.fillStyle = '#8dffc9'; ctx.fillRect(-12, -8, 24, 8);
    ctx.fillStyle = '#1d7a4d'; ctx.fillRect(-4, 16, 8, 9);
    ctx.fillStyle = '#bfffe2'; circle(-12, 7, 3); circle(12, 7, 3);
  } else if (e.type === 'splitter') {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(20,-14); ctx.lineTo(0,-20); ctx.lineTo(-20,-14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(0,14); ctx.stroke();
  } else if (e.type === 'splitling') {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(10,-8); ctx.lineTo(-10,-8); ctx.closePath(); ctx.fill();
  } else if (e.type === 'orbiter') {
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
    ctx.fillStyle = col; circle(0, 0, 5);
    if (player) {
      ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
      ctx.fillStyle = '#dff6ff'; ctx.fillRect(10, -2, 8, 4);
    }
  } else if (e.type === 'sniper') {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(14,4); ctx.lineTo(8,16); ctx.lineTo(-8,16); ctx.lineTo(-14,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; circle(0, 0, 4);
    if (e.phase === 'warn' && player) {
      ctx.strokeStyle = 'rgba(255,80,80,' + (0.4 + 0.4*Math.sin(state.time*24)) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, 10);
      ctx.lineTo(player.x - e.x, player.y - e.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  } else if (e.type === 'mine') {
    const pulse = 0.6 + 0.4*Math.sin(e.t*8);
    ctx.fillStyle = 'rgba(255,60,60,' + (0.25*pulse) + ')';
    circle(0, 0, 24);
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    for (let i = 0; i < 8; i++) {
      const a = i/8*TAU + e.t;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*8, Math.sin(a)*8);
      ctx.lineTo(Math.cos(a)*17, Math.sin(a)*17); ctx.stroke();
    }
    ctx.fillStyle = '#ff5b5b'; circle(0, 0, 8);
    ctx.fillStyle = '#fff'; circle(0, 0, 3.5);
  } else if (e.type === 'boss') drawBossBody(e, col);
  ctx.restore();
}
function drawBossBody(e, col) {
  const pulse = 1 + 0.03*Math.sin(e.t*4);
  ctx.scale(pulse, pulse);
  const shield = e.inv > 0;
  ctx.fillStyle = (e.flash > 0 || shield) ? '#ffffff' : '#4a1038';
  roundRect(-52, -30, 104, 62, 16); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#a01d63';
  circle(-34, 6, 14); circle(34, 6, 14);
  const glow = 0.5 + 0.5*Math.sin(e.t*5);
  ctx.fillStyle = 'rgba(255,120,190,' + (0.5 + glow*0.5) + ')';
  circle(0, -2, 13);
  ctx.fillStyle = '#ffe3f1'; circle(-34, 6, 5); circle(34, 6, 5);
  ctx.fillStyle = '#33082a'; ctx.fillRect(-26, 26, 52, 10);
  if (shield) {
    ctx.strokeStyle = 'rgba(120,220,255,' + (0.5 + 0.3*Math.sin(state.time*10)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 2, 62, 0, TAU); ctx.stroke();
  }
}
function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y); ctx.rotate(r.rot);
  ctx.fillStyle = r.flash > 0 ? '#ffffff' : '#8a7f75';
  ctx.beginPath();
  for (let i = 0; i < r.verts.length; i++) {
    const a = i / r.verts.length * TAU;
    const rr = r.r * r.verts[i];
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6c625a'; circle(-r.r*0.2, -r.r*0.15, r.r*0.35);
  ctx.strokeStyle = '#b7a99b'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function drawUfo() {
  if (!ufo) return;

  ctx.fillStyle = 'rgba(200,235,255,0.9)';
  ctx.beginPath(); ctx.ellipse(0, -8, 12, 9, 0, Math.PI, 0); ctx.fill();
  for (let i = -2; i <= 2; i++) {
    ctx.fillStyle = Math.sin(ufo.t*6 + i) > 0 ? '#ffd85f' : '#7fb0d0';

}
function drawCrate(c) {
  ctx.save();
  ctx.translate(c.x, c.y); ctx.rotate(Math.sin(c.t*3)*0.15);
  ctx.fillStyle = '#b07c3f'; roundRect(-14, -14, 28, 28, 5); ctx.fill();

}
function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);

}
function drawPowerup(pu) {
  const col = CC[pu.kind] || '#8ff3ff';
  ctx.save();
  ctx.translate(pu.x, pu.y);
  ctx.rotate(pu.t * 1.6);
  const s = 1 + 0.08*Math.sin(pu.t*6);
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(10,20,35,0.85)';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i/4*TAU;
    const px = Math.cos(a)*13*s, py = Math.sin(a)*13*s;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.rotate(-pu.t * 1.6);
  ctx.fillStyle = col;
  if (pu.kind === 'weapon') { ctx.fillRect(-4, -6, 2.6, 12); ctx.fillRect(-1.3, -7, 2.6, 12); ctx.fillRect(1.4, -6, 2.6, 12); }
  else if (pu.kind === 'shield') { ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, TAU); ctx.stroke(); }
  else if (pu.kind === 'rapid') { ctx.beginPath(); ctx.moveTo(2,-8); ctx.lineTo(-4,1); ctx.lineTo(0,1); ctx.lineTo(-2,8); ctx.lineTo(4,-1); ctx.lineTo(0,-1); ctx.closePath(); ctx.fill(); }
  else if (pu.kind === 'missile') { ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(4,4); ctx.lineTo(0,2); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill(); }
  else if (pu.kind === 'laser') { ctx.fillRect(-1.4, -8, 2.8, 16); }
  else if (pu.kind === 'drone') { ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(6,5); ctx.lineTo(-6,5); ctx.closePath(); ctx.fill(); }
  else if (pu.kind === 'magnet') { ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(0, -1, 5, Math.PI, 0); ctx.stroke(); ctx.fillRect(-7, -1, 3, 7); ctx.fillRect(4, -1, 3, 7); }
  else { ctx.beginPath(); ctx.moveTo(0,6); ctx.bezierCurveTo(6,0,4,-5,0,-2); ctx.bezierCurveTo(-4,-5,-6,0,0,6); ctx.fill(); }
  ctx.restore();
}

function drawMissiles() {
  for (const m of missiles) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI/2);
    ctx.fillStyle = CC.missile;
    ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,5); ctx.lineTo(0,2); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  for (const m of emissiles) {
    ctx.fillStyle = 'rgba(255,110,90,0.9)'; circle(m.x, m.y, 5);
    ctx.fillStyle = '#ffe0c0'; circle(m.x, m.y, 2.2);
  }
}
function drawDrones() {
  const p = player;
  if (!p || p.drones <= 0) return;
  for (let k = 0; k < 2; k++) {
    const a = p.droneA + k*Math.PI;
    const dx = p.x + Math.cos(a)*38, dy = p.y + Math.sin(a)*38;
    ctx.save(); ctx.translate(dx, dy);
    const tgt = nearestEnemy(dx, dy);
    if (tgt) ctx.rotate(Math.atan2(tgt.y - dy, tgt.x - dx));
    ctx.fillStyle = CC.drone;
    ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,-4); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawBeams() {
  for (const b of beams) {
    const y0 = b.src ? b.src.y + 20 : 0;
    if (b.phase === 'warn') {
      const a = (0.18 + 0.12*Math.sin(state.time*20)) * clamp(b.t/0.9 + 0.3, 0, 1);
      ctx.fillStyle = 'rgba(255,60,90,' + a + ')';
      ctx.fillRect(b.x - b.w/2, y0, b.w, H - y0);

      g2.addColorStop(0.3, 'rgba(255,90,150,0.8)');
      g2.addColorStop(1, 'rgba(255,60,120,0.4)');
      ctx.fillStyle = g2;
      ctx.fillRect(b.x - b.w/2, y0, b.w, H - y0);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';

}
function drawBulletsFx() {
  ctx.save();

    ctx.fillStyle = 'rgba(90,190,255,0.35)'; circle(b.x, b.y, b.r*2.4);

function drawParticlesFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const q of particles) {
    const a = clamp(q.life/q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    circle(q.x, q.y, q.size*(0.4 + a*0.6));
  }
  ctx.restore();
  for (const r of rings) {
    ctx.globalAlpha = clamp(r.life/r.max, 0, 1);
    ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const d of debris) {
    ctx.globalAlpha = clamp(d.life/d.max, 0, 1);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.sides; i++) {
      const ang = i/d.sides*TAU;
      const px = Math.cos(ang)*d.size, py = Math.sin(ang)*d.size;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);

  ctx.globalAlpha = 1;
  for (const f of floats) {

    ctx.font = '700 14px system-ui, "Segoe UI", sans-serif';

    ctx.fillText(f.text, f.x, f.y);

/* ---------- çizim: HUD ---------- */
function drawHUD() {
  const p = player;
  if (!p) return;
  ctx.textBaseline = 'top';
  ctx.font = '700 16px system-ui, "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#cfefff';

  ctx.textAlign = 'right';
  ctx.fillStyle = '#7d8fa8';
  ctx.fillText(t('best_fmt', { n: fmt(P.best) }), W - 14, 12);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8fd0ff';
  ctx.fillText(t('hud_wave', { n: state.wave || 1 }), W / 2, 12);
  if (state.mod === 'ast') {
    ctx.fillStyle = '#d8c6a8';

    ctx.fillRect(W/2 - 60, 66, 120, 4);

  }

    ctx.moveTo(0, -18); ctx.lineTo(10, 5); ctx.lineTo(6, 13); ctx.lineTo(-6, 13); ctx.lineTo(-10, 5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

    ctx.fillStyle = i < state.bombs ? '#ffcf5f' : '#889';
    circle(bx, by, 5.5);
    ctx.globalAlpha = 1;
  }
  let y = H - 22;
  ctx.textAlign = 'right';
  ctx.font = '700 13px system-ui, "Segoe UI", sans-serif';
  const badges = [];
  if (p.weapon > 1) badges.push([t('p_weapon', { n: p.weapon }), CC.weapon]);
  if (p.rapid > 0) badges.push([t('p_rapid') + ' ' + p.rapid.toFixed(1), CC.rapid]);
  if (p.shield > 0) badges.push([t('p_shield') + ' ' + p.shield.toFixed(1), CC.shield]);
  if (p.missiles > 0) badges.push([t('p_missile') + ' ' + p.missiles.toFixed(1), CC.missile]);
  if (p.laser > 0) badges.push([t('p_laser') + ' ' + p.laser.toFixed(1), CC.laser]);
  if (p.drones > 0) badges.push([t('p_drone') + ' ' + p.drones.toFixed(1), CC.drone]);
  if (p.magnet > 0) badges.push([t('p_magnet') + ' ' + p.magnet.toFixed(1), CC.magnet]);
  for (const b of badges) { ctx.fillStyle = b[1]; ctx.fillText(b[0], W - 14, y); y -= 19; }
  const boss = enemies.find(e => e.type === 'boss');
  if (boss && boss.entered) {
    const bw = W - 120;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(60, 42, bw, 8, 4); ctx.fill();
    ctx.fillStyle = CC.boss;
    roundRect(60, 42, bw * clamp(boss.hp / boss.maxhp, 0, 1), 8, 4); ctx.fill();
    ctx.fillStyle = '#ffb3d9';
    ctx.font = '700 11px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    const nm = t('boss_' + ['spread','laser','missile'][boss.btype] || 'spread');
    ctx.fillText(nm + (boss.phase === 2 ? '  II' : ''), W / 2, 54);
  }
  if (state.waveBanner > 0) {
    const bossWarn = enemies.some(e => e.type === 'boss' && !e.entered);
    ctx.globalAlpha = clamp(state.waveBanner, 0, 1) * (bossWarn ? (0.55 + 0.45*Math.sin(state.time*10)) : 0.9);
    ctx.textAlign = 'center';
    if (bossWarn) {
      ctx.fillStyle = '#ff5fa8';
      ctx.font = '800 26px system-ui, "Segoe UI", sans-serif';
      ctx.fillText(t('boss_warn'), W/2, 270);

      ctx.font = '800 34px system-ui, "Segoe UI", sans-serif';

        ctx.font = '700 16px system-ui, "Segoe UI", sans-serif';
        ctx.fillText(t('mod_ast'), W / 2, 312);
      }
    }
    ctx.globalAlpha = 1;
  }
  if (state.clearT > 0) {
    ctx.globalAlpha = clamp(state.clearT, 0, 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8fffb0';
    ctx.font = '800 22px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(state.clearText, W / 2, 350);
    ctx.globalAlpha = 1;
  }
  if (state.runT < 10 && state.wave <= 1 && !touchDevice) {

    ctx.fillStyle = 'rgba(160,200,235,' + clamp(10 - state.runT, 0, 1) * 0.8 + ')';
    ctx.font = '600 13px system-ui, "Segoe UI", sans-serif';

/* ---------- dokunmatik kontroller ---------- */
function touchButtons() {
  return [
    { x: W - 58, y: H - 168, r: 32, act: doDash, label: '»' },
    { x: W - 58, y: H - 88, r: 32, act: useBomb, label: 'B' }
  ];
}
function drawTouch() {
  if (!touchDevice || state.mode !== 'playing') return;
  if (joy.on) {
    ctx.strokeStyle = 'rgba(159,240,255,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 46, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(159,240,255,0.5)';
    circle(joy.ox + joy.vx*34, joy.oy + joy.vy*34, 16);
  }
  const btns = touchButtons();
  for (const b of btns) {
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(10,25,45,0.6)';
    circle(b.x, b.y, b.r);
    ctx.strokeStyle = 'rgba(159,240,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#cfefff';
    ctx.font = '800 20px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y + 1);
    ctx.globalAlpha = 1;
  }
  ctx.textBaseline = 'top';
  if (player && player.dashT > 0) {
    ctx.strokeStyle = 'rgba(255,216,95,0.9)'; ctx.lineWidth = 3;
    const prog = 1 - player.dashT / st.dashCd;
    ctx.beginPath(); ctx.arc(btns[0].x, btns[0].y, btns[0].r - 4, -Math.PI/2, -Math.PI/2 + TAU*prog); ctx.stroke();
  }
  ctx.fillStyle = '#ffcf5f';
  ctx.font = '800 12px system-ui, sans-serif';
  ctx.fillText('x' + state.bombs, btns[1].x + 26, btns[1].y + 18);
}

/* ---------- ekran efektleri ---------- */
function drawEffects() {
  if (vinC) ctx.drawImage(vinC, 0, 0, W, H);
  if (state.mode === 'playing' && state.lives <= 1 && redC && !S.rmotion) {
    ctx.globalAlpha = 0.45 + 0.3*Math.sin(state.time*5);
    ctx.drawImage(redC, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (state.flashA > 0.01) {
    ctx.globalAlpha = clamp(state.flashA, 0, 0.85);
    ctx.fillStyle = state.flashCol;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (S.scan && scanP) {
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = scanP;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (S.fps) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(160,200,235,0.8)';
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillText(Math.round(state.fps) + ' FPS', W - 14, 34);
  }
  let ty = 84;
  for (const tst of state.toasts) {
    const a = clamp(Math.min(tst.life, tst.max - tst.life) * 3, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '700 12px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(tst.text).width + 22;
    ctx.fillStyle = 'rgba(8,22,18,0.8)';
    roundRect(14, ty, w, 24, 6); ctx.fill();
    ctx.strokeStyle = tst.color; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = tst.color;
    ctx.fillText(tst.text, 25, ty + 12);
    ctx.textBaseline = 'top';
    ty += 30;
    ctx.globalAlpha = 1;
  }
}

/* ---------- ana çizim ---------- */
function render() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackground();
  ctx.save();
  const z = state.zoomT > 0
    ? 1 + (state.zoomAmt - 1) * Math.sin(Math.PI * clamp(state.zoomT / state.zoomDur, 0, 1)) : 1;
  if (z !== 1) { ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2); }
  if (state.shake > 0.12) ctx.translate(rand(-1,1)*state.shake, rand(-1,1)*state.shake);
  for (const c of crates) drawCrate(c);
  for (const c of coins) drawCoin(c);
  for (const pu of powerups) drawPowerup(pu);
  for (const r of rocks) drawRock(r);
  for (const e of enemies) drawEnemy(e);
  drawUfo();
  drawBeams();
  drawBulletsFx();
  drawMissiles();
  drawDrones();
  if (state.mode !== 'menu') drawPlayer();
  drawParticlesFx();
  ctx.restore();
  if ((state.mode === 'playing' || state.mode === 'paused' || state.mode === 'over' || state.mode === 'upgrade') && player) drawHUD();
  drawTouch();
  drawEffects();
  if (state.mode === 'menu') renderMenu();
  else if (state.mode === 'paused') renderPause();
  else if (state.mode === 'over') renderOver();
  else if (state.mode === 'upgrade') renderUpgrade();
}

function drawRow(y, label, value, opts) {
  opts = opts || {};
  const h = opts.h || 40, x = 40, w = W - 80;
  const focus = opts.fi != null && opts.fi === UI.fi;
  ctx.fillStyle = focus ? 'rgba(40,90,140,0.4)' : 'rgba(16,26,44,0.55)';
  roundRect(x, y, w, h, 9); ctx.fill();
  ctx.strokeStyle = focus ? '#4fc3ff' : 'rgba(90,140,180,0.3)';
  ctx.lineWidth = focus ? 2 : 1.2;
  ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = opts.dim ? '#8a97a8' : (focus ? '#eaf6ff' : '#bfd4e6');
  ctx.font = (opts.fs || 15) + 'px system-ui, "Segoe UI", sans-serif';
  ctx.font = '700 ' + (opts.fs || 15) + 'px system-ui, "Segoe UI", sans-serif';
  ctx.fillText(label, x + 16, y + h/2 + 1);
  if (value != null) {
    ctx.textAlign = 'right';
    ctx.fillStyle = opts.col || (focus ? '#ffe9a8' : '#9fc5dd');
    ctx.font = '700 14px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(value, x + w - 16, y + h/2 + 1);
  }
  return { x, y, w, h };
}
function addRow(y, label, value, opts, item) {
  opts = opts || {};
  opts.fi = UI.items.length;
  const r = drawRow(y, label, value, opts);
  UI.row(r.x, r.y, r.w, r.h, item);
  return r;
}

/* ---------- girdi ---------- */
const KEYS = {};
const pointer = { x: W/2, y: H-90, last: -99, down: false };
const padPrev = {};
function canvasPos(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  KEYS[k] = true;
  if (e.repeat) return;
  if (k === 'm') { S.mute = !S.mute; saveS(); if (!S.mute) sfx.power(); return; }
  if (k === 'f') { toggleFullscreen(); return; }
  const m = state.mode;
  if (m === 'menu') {
    if (k === 'arrowup' || k === 'w') UI.move(-1);
    else if (k === 'arrowdown' || k === 's') UI.move(1);
    else if (k === 'arrowleft' || k === 'a') UI.adjust(-1);
    else if (k === 'arrowright' || k === 'd') UI.adjust(1);
    else if (k === 'enter' || k === ' ') UI.activate();
    else if (k === 'escape' && state.menuPage !== 'main') { state.menuPage = 'main'; sfx.tick(); }
  } else if (m === 'playing') {
    if (k === 'shift') doDash();
    else if (k === 'b') useBomb();
    else if (k === 'p' || k === 'escape') pauseGame();
  } else if (m === 'paused') {
    if (k === 'p' || k === 'escape' || k === ' ') resumeGame();
    else if (k === 'arrowup' || k === 'w') UI.move(-1);
    else if (k === 'arrowdown' || k === 's') UI.move(1);
    else if (k === 'enter') UI.activate();
  } else if (m === 'upgrade') {
    if (k === '1' || k === '2' || k === '3') chooseUpgrade(+k - 1);
    else if (k === 'arrowup' || k === 'arrowdown' || k === 'w' || k === 's' || k === 'arrowleft' || k === 'a') UI.move(k === 'arrowup' || k === 'w' || k === 'arrowleft' || k === 'a' ? -1 : 1);
    else if (k === 'arrowright' || k === 'd') UI.move(1);
    else if (k === 'enter' || k === ' ') UI.activate();
  } else if (m === 'over') {
    if ((k === ' ' || k === 'enter' || k === 'r') && state.overT > 0.8) startGame();
    else if (k === 'arrowup' || k === 'w') UI.move(-1);
    else if (k === 'arrowdown' || k === 's') UI.move(1);
    else if (k === 'escape') backToMenu();
  }
});
window.addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
function menuHover(x, y) {
  const m = state.mode;
  if (m === 'menu' || m === 'paused' || m === 'upgrade' || m === 'over') UI.hover(x, y);
}
canvas.addEventListener('pointermove', ev => {
  const p = canvasPos(ev);
  pointer.x = p.x; pointer.y = p.y; pointer.last = state.time;
  if (ev.pointerType === 'touch' && joy.on && ev.pointerId === joy.id) {
    const dx = p.x - joy.ox, dy = p.y - joy.oy;
    let vx = dx / 48, vy = dy / 48;
    const l = Math.hypot(vx, vy);
    if (l > 1) { vx /= l; vy /= l; }
    joy.vx = vx; joy.vy = vy;
    return;
  }
  menuHover(p.x, p.y);
});
canvas.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const p = canvasPos(ev);
  pointer.x = p.x; pointer.y = p.y; pointer.last = state.time;
  const m = state.mode;
  if (ev.pointerType === 'touch' && m === 'playing') {
    pointer.down = true;
    const btns = touchButtons();
    for (const b of btns)
      if (dist2(p.x, p.y, b.x, b.y) < b.r * b.r * 1.35) { b.act(); return; }
    if (p.x < W * 0.62 && !joy.on) {
      joy.on = true; joy.id = ev.pointerId; joy.ox = p.x; joy.oy = p.y; joy.vx = 0; joy.vy = 0;
      return;
    }
    return;
  }
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(ev.pointerId); } catch (e) {} }
  if (m === 'menu' || m === 'paused' || m === 'upgrade' || m === 'over') { UI.hit(p.x, p.y); return; }
  pointer.down = true;
});
window.addEventListener('pointerup', ev => {
  pointer.down = false;
  if (joy.on && ev.pointerId === joy.id) { joy.on = false; joy.id = -1; joy.vx = 0; joy.vy = 0; }
});
window.addEventListener('pointercancel', () => {
  pointer.down = false;
  joy.on = false; joy.vx = 0; joy.vy = 0;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  } catch (e) {}
}
/* ---------- gamepad ---------- */
function pollPad() {
  if (!navigator.getGamepads) return;
  const pad = navigator.getGamepads()[0];
  if (!pad) { padMove = null; return; }
  const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
  padMove = Math.hypot(ax, ay) > 0.2 ? { x: ax, y: ay } : null;
  const b = pad.buttons;
  const pressed = i => !!(b[i] && b[i].pressed);
  const just = i => pressed(i) && !padPrev[i];
  if (state.mode === 'playing') {
    if (just(0)) useBomb();
    if (just(1) || just(5)) doDash();
    if (just(9)) pauseGame();
  } else if (state.mode === 'paused') {
    if (just(9) || just(0)) resumeGame();
  } else if (state.mode === 'menu') {
    if (just(0) || just(9)) UI.activate();
    if (just(13) || just(12)) UI.move(just(13) ? -1 : 1);
  }
  for (let i = 0; i < b.length; i++) padPrev[i] = pressed(i);
}

/* ---------- ana döngü ---------- */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.033);
  state.fpsAcc += dt; state.fpsN++;
  if (state.fpsAcc >= 0.5) { state.fps = state.fpsN / state.fpsAcc; state.fpsAcc = 0; state.fpsN = 0; }
  pollPad();
  musicUpdate();
  update(dt);
  render();
  requestAnimationFrame(loop);
}
resetRun();
player = null;
requestAnimationFrame(loop);
})();
</script>
