<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070f">
<title>Yıldız Akını</title>
<style>
  html, body { height:100%; margin:0; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, #0a1030 0%, #05070f 55%, #030409 100%);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  #wrap { height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { height:min(100vh,150vw); width:auto; aspect-ratio:2/3; display:block;
    background:#04060f; border-radius:16px; touch-action:none; cursor:crosshair;
    box-shadow:0 0 90px rgba(60,150,255,.35), 0 0 34px rgba(150,80,255,.18),
      0 0 0 1px rgba(120,200,255,.22); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
'use strict';
/* ==========================================================
   YILDIZ AKINI v7 NEON VOID — tek dosyalık neon uzay savaşı (160+ özellik)
   Hareket: ok/WASD/fare/dokunma/gamepad · Ateş: otomatik
   Shift: atılma · U: öfke · B: bomba · P: duraklat · M: ses · F: tam ekran
   ========================================================== */
(() => {
const W = 480, H = 720, TAU = Math.PI * 2;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fit();
window.addEventListener('resize', fit);

/* ---------- yardımcılar ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const pick = a => a[(Math.random() * a.length) | 0];
const fmt = n => { n = Math.round(n); return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, S.lang === 'en' ? ',' : '.'); };
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ---------- v4: NEON VOID gorunum katmani ---------- */
const TH = {
  bg: '#05070f', cyan: '#59e6ff', blue: '#3aa0ff', violet: '#9d7bff', mag: '#ff5fd2',
  gold: '#ffd166', mint: '#5cf2b6', text: '#eaf6ff', mut: '#8ba3c0'
};
const RANK_COL = { D: '#8ba3c0', C: '#59e6ff', B: '#9d7bff', A: '#ffd166', S: '#ff5fd2' };
function glowDot(x, y, r, col, a) {
  a = a == null ? 1 : a;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.restore();
}
function gradText(text, x, y, font, c1, c2, glowCol) {
  ctx.save();
  ctx.font = font;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const w = Math.max(10, ctx.measureText(text).width);
  const g = ctx.createLinearGradient(x - w / 2, y, x + w / 2, y);
  g.addColorStop(0, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c1);
  if (glowCol) { ctx.shadowColor = glowCol; ctx.shadowBlur = 16; }
  ctx.fillStyle = g;
  ctx.fillText(text, x, y);
  ctx.restore();
  return w;
}
function panel(x, y, w, h, r, opt) {
  opt = opt || {};
  ctx.beginPath(); roundRect(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, opt.c1 || 'rgba(30,44,86,0.55)');
  g.addColorStop(1, opt.c2 || 'rgba(10,15,34,0.8)');
  if (opt.glow && !S.rmotion) { ctx.shadowColor = opt.glow; ctx.shadowBlur = 18; }
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = opt.lw || 1.2;
  ctx.strokeStyle = opt.border || 'rgba(112,200,255,0.22)';
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + r, y + 1.2); ctx.lineTo(x + w - r, y + 1.2); ctx.stroke();
}
function pill(x, y, w, h, text, col, opt) {
  opt = opt || {};
  ctx.beginPath(); roundRect(x, y, w, h, h / 2);
  ctx.fillStyle = opt.fill || 'rgba(14,22,44,0.72)';
  ctx.fill();
  ctx.strokeStyle = opt.border || 'rgba(120,190,255,0.25)';
  ctx.lineWidth = 1; ctx.stroke();
  if (text) {
    ctx.fillStyle = col || TH.text;
    ctx.font = opt.fs || '700 12px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2 + 0.5);
  }
}
function iconGlyph(cx, cy, s, name, col) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1.4, s * 0.15);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s*0.4, -s*0.62); ctx.lineTo(s*0.66, 0); ctx.lineTo(-s*0.4, s*0.62); ctx.closePath(); ctx.fill(); }
  else if (name === 'ship') { ctx.beginPath(); ctx.moveTo(0, -s*0.8); ctx.lineTo(s*0.52, s*0.55); ctx.lineTo(0, s*0.26); ctx.lineTo(-s*0.52, s*0.55); ctx.closePath(); ctx.fill(); }
  else if (name === 'gauge') {
    ctx.beginPath(); ctx.arc(0, s*0.12, s*0.62, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, s*0.12); ctx.lineTo(s*0.34, -s*0.26); ctx.stroke();
  }
  else if (name === 'planet') {
    ctx.beginPath(); ctx.arc(0, 0, s*0.4, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.78, s*0.26, -0.5, 0, TAU); ctx.stroke();
  }
  else if (name === 'bag') {
    ctx.beginPath(); ctx.rect(-s*0.5, -s*0.26, s, s*0.82); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s*0.26, s*0.3, Math.PI, 0); ctx.stroke();
  }
  else if (name === 'trophy') {
    ctx.beginPath(); ctx.rect(-s*0.36, -s*0.62, s*0.72, s*0.46); ctx.stroke();
    ctx.beginPath(); ctx.arc(-s*0.56, -s*0.5, s*0.2, Math.PI*0.5, Math.PI*1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.56, -s*0.5, s*0.2, -Math.PI*0.5, Math.PI*0.5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -s*0.16); ctx.lineTo(0, s*0.4);
    ctx.moveTo(-s*0.34, s*0.44); ctx.lineTo(s*0.34, s*0.44);
    ctx.moveTo(-s*0.24, s*0.14); ctx.lineTo(s*0.24, s*0.14);
    ctx.stroke();
  }
  else if (name === 'lock') {
    ctx.beginPath(); ctx.rect(-s*0.48, -s*0.04, s*0.96, s*0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s*0.04, s*0.3, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, s*0.26, s*0.08, 0, TAU); ctx.fill();
  }
  else if (name === 'chart') {
    ctx.beginPath();
    ctx.moveTo(-s*0.6, s*0.45); ctx.lineTo(s*0.6, s*0.45);
    ctx.moveTo(-s*0.36, s*0.45); ctx.lineTo(-s*0.36, s*0.02);
    ctx.moveTo(0, s*0.45); ctx.lineTo(0, -s*0.24);
    ctx.moveTo(s*0.36, s*0.45); ctx.lineTo(s*0.36, -s*0.5);
    ctx.stroke();
  }
  else if (name === 'medal') {
    ctx.beginPath(); ctx.arc(0, s*0.14, s*0.4, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s*0.2, -s*0.3); ctx.lineTo(-s*0.32, -s*0.78); ctx.lineTo(0, -s*0.54);
    ctx.lineTo(s*0.32, -s*0.78); ctx.lineTo(s*0.2, -s*0.3);
    ctx.closePath(); ctx.fill();
  }
  else if (name === 'gear') {
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * s*0.44, Math.sin(a) * s*0.44);
      ctx.lineTo(Math.cos(a) * s*0.74, Math.sin(a) * s*0.74);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, s*0.42, 0, TAU); ctx.stroke();
  }
  else if (name === 'coin') {
    ctx.beginPath(); ctx.arc(0, 0, s*0.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(0, 0, s*0.28, 0, TAU); ctx.fill();
  }
  else if (name === 'dust' || name === 'star') {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU - Math.PI / 2;
      const rr = i % 2 ? s*0.32 : s*0.68;
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
  else if (name === 'bolt') {
    ctx.beginPath();
    ctx.moveTo(s*0.26, -s*0.72); ctx.lineTo(-s*0.3, s*0.1); ctx.lineTo(s*0.02, s*0.1);
    ctx.lineTo(-s*0.26, s*0.74); ctx.lineTo(s*0.32, -s*0.08); ctx.lineTo(0, -s*0.08);
    ctx.closePath(); ctx.fill();
  }
  else if (name === 'bomb') {
    ctx.beginPath(); ctx.arc(-s*0.1, s*0.16, s*0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s*0.18, -s*0.22); ctx.lineTo(s*0.44, -s*0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(s*0.5, -s*0.66, s*0.13, 0, TAU); ctx.fill();
  }
  else if (name === 'dash') {
    ctx.beginPath();
    ctx.moveTo(-s*0.5, -s*0.44); ctx.lineTo(-s*0.02, 0); ctx.lineTo(-s*0.5, s*0.44);
    ctx.moveTo(s*0.04, -s*0.44); ctx.lineTo(s*0.52, 0); ctx.lineTo(s*0.04, s*0.44);
    ctx.stroke();
  }
  else if (name === 'heart') {
    ctx.beginPath();
    ctx.moveTo(0, s*0.62);
    ctx.bezierCurveTo(s*0.9, -s*0.05, s*0.4, -s*0.72, 0, -s*0.24);
    ctx.bezierCurveTo(-s*0.4, -s*0.72, -s*0.9, -s*0.05, 0, s*0.62);
    ctx.fill();
  }
  else if (name === 'shield') {
    ctx.beginPath(); ctx.arc(0, 0, s*0.52, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s*0.2, 0, TAU); ctx.fill();
  }
  else if (name === 'rocket') {
    ctx.beginPath();
    ctx.moveTo(0, -s*0.76); ctx.lineTo(s*0.34, s*0.06); ctx.lineTo(s*0.14, s*0.02);
    ctx.lineTo(s*0.26, s*0.5); ctx.lineTo(0, s*0.28); ctx.lineTo(-s*0.26, s*0.5);
    ctx.lineTo(-s*0.14, s*0.02); ctx.lineTo(-s*0.34, s*0.06);
    ctx.closePath(); ctx.fill();
  }
  else if (name === 'magnet') {
    ctx.lineWidth = s*0.3;
    ctx.beginPath(); ctx.arc(0, -s*0.06, s*0.42, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.42, -s*0.06); ctx.lineTo(-s*0.42, s*0.42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.42, -s*0.06); ctx.lineTo(s*0.42, s*0.42); ctx.stroke();
  }
  else if (name === 'flame') {
    ctx.beginPath();
    ctx.moveTo(0, s*0.7);
    ctx.bezierCurveTo(s*0.62, s*0.08, s*0.36, -s*0.34, 0, -s*0.76);
    ctx.bezierCurveTo(-s*0.36, -s*0.34, -s*0.62, s*0.08, 0, s*0.7);
    ctx.closePath(); ctx.fill();
  }
  else if (name === 'clock') {
    ctx.beginPath(); ctx.arc(0, 0, s*0.6, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -s*0.32); ctx.lineTo(0, s*0.06); ctx.lineTo(s*0.26, s*0.2); ctx.stroke();
  }
  else if (name === 'target') {
    ctx.beginPath(); ctx.arc(0, 0, s*0.56, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s*0.18, 0, TAU); ctx.fill();
  }
  else if (name === 'skull') {
    ctx.beginPath(); ctx.arc(0, -s*0.14, s*0.44, Math.PI, 0);
    ctx.lineTo(s*0.44, s*0.28); ctx.lineTo(s*0.16, s*0.28); ctx.lineTo(s*0.16, s*0.48);
    ctx.lineTo(-s*0.16, s*0.48); ctx.lineTo(-s*0.16, s*0.28); ctx.lineTo(-s*0.44, s*0.28);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-s*0.17, -s*0.1, s*0.13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.17, -s*0.1, s*0.13, 0, TAU); ctx.fill();
  }
  else if (name === 'note') {
    ctx.beginPath(); ctx.arc(-s*0.2, s*0.34, s*0.24, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, s*0.34); ctx.lineTo(0, -s*0.5); ctx.lineTo(s*0.45, -s*0.36); ctx.stroke();
  }
  else if (name === 'wave') {
    ctx.beginPath();
    ctx.moveTo(-s*0.6, s*0.28); ctx.lineTo(-s*0.6, -s*0.28);
    ctx.moveTo(-s*0.2, s*0.5); ctx.lineTo(-s*0.2, -s*0.5);
    ctx.moveTo(s*0.2, s*0.34); ctx.lineTo(s*0.2, -s*0.34);
    ctx.moveTo(s*0.6, s*0.18); ctx.lineTo(s*0.6, -s*0.18);
    ctx.stroke();
  }
  else if (name === 'grid') {
    ctx.beginPath();
    ctx.rect(-s*0.55, -s*0.55, s*0.44, s*0.44);
    ctx.rect(s*0.11, -s*0.55, s*0.44, s*0.44);
    ctx.rect(-s*0.55, s*0.11, s*0.44, s*0.44);
    ctx.rect(s*0.11, s*0.11, s*0.44, s*0.44);
    ctx.stroke();
  }
  else if (name === 'eye') {
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.66, s*0.4, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s*0.2, 0, TAU); ctx.fill();
  }
  else if (name === 'globe') {
    ctx.beginPath(); ctx.arc(0, 0, s*0.58, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.26, s*0.58, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.54, 0); ctx.lineTo(s*0.54, 0); ctx.stroke();
  }
  else if (name === 'wind') {
    ctx.beginPath();
    ctx.moveTo(-s*0.6, -s*0.28); ctx.lineTo(s*0.16, -s*0.28);
    ctx.arc(s*0.16, -s*0.42, s*0.16, Math.PI*0.5, Math.PI*1.5, true);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s*0.6, s*0.2); ctx.lineTo(s*0.4, s*0.2);
    ctx.arc(s*0.4, s*0.34, s*0.16, Math.PI*1.5, Math.PI*0.5);
    ctx.stroke();
  }
  else if (name === 'arrow') {
    ctx.beginPath(); ctx.moveTo(s*0.5, 0); ctx.lineTo(-s*0.4, -s*0.5); ctx.lineTo(-s*0.4, s*0.5); ctx.closePath(); ctx.fill();
  }
  else if (name === 'cross') {
    ctx.beginPath(); ctx.arc(0, 0, s*0.16, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s*0.7, 0); ctx.lineTo(-s*0.36, 0);
    ctx.moveTo(s*0.36, 0); ctx.lineTo(s*0.7, 0);
    ctx.moveTo(0, -s*0.7); ctx.lineTo(0, -s*0.36);
    ctx.moveTo(0, s*0.36); ctx.lineTo(0, s*0.7);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- kalıcı veriler ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const defS = { music: 0.5, sfx: 0.7, shake: true, parts: 2, scan: false, fps: false,
  cblind: false, rmotion: false, lang: 'tr', mute: false, ship: 'std', diff: 'normal',
  gmode: 'classic', haptic: true, skin: 0, trail: 'classic', boom: 'classic' };
const defP = { coins: 0, kills: 0, deaths: 0, games: 0, bosses: 0, shots: 0, hits: 0,
  maxCombo: 0, collected: 0, playtime: 0, best: 0, bestWave: 0, board: [], ach: {}, shop: {},
  dust: 0, dustTotal: 0, chipsFound: {}, modesPlayed: {}, boards: {}, dailyLast: '',
  shipsPlayed: {}, skinsUsed: {}, abils: 0, missClaimed: 0, miss: null, timeBest: 0,
  shipUp: {}, shipBest: {}, recent: [], bestTime: 0, perfectBest: 0, week: null, weeksClaimed: 0, lastScore: 0 };
let S = Object.assign({}, defS, LS.get('ya_settings', {}));
if (typeof S.skin !== 'number' || S.skin < 0 || S.skin > 7) S.skin = 0;
let P = Object.assign({}, defP, LS.get('ya_profile', {}));
{ const old = +(localStorage.getItem('yildizAkiniBest') || 0); if (old > P.best) P.best = old; }
if (!P.boards || typeof P.boards !== 'object') P.boards = {};
for (const mk of ['classic', 'endless', 'rush', 'daily', 'time', 'perfect'])
  if (!Array.isArray(P.boards[mk])) P.boards[mk] = (mk === 'classic' && Array.isArray(P.board)) ? P.board.slice() : [];
if (!P.chipsFound || typeof P.chipsFound !== 'object') P.chipsFound = {};
if (!P.modesPlayed || typeof P.modesPlayed !== 'object') P.modesPlayed = {};
if (!P.shipUp || typeof P.shipUp !== 'object') P.shipUp = {};
if (!P.shipBest || typeof P.shipBest !== 'object') P.shipBest = {};
if (!P.recent || !Array.isArray(P.recent)) P.recent = [];
if (!P.week || typeof P.week !== 'object') P.week = null;
const saveS = () => LS.set('ya_settings', S);
const saveP = () => LS.set('ya_profile', P);
const RNG0 = Math.random;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buzz(ms) { if (!S.haptic) return; try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- oyun verisi ---------- */
const SHIPS = {
  std:   { color: '#9ef0ff', speed: 330, fireCd: 0.15,  lives: 3, hitR: 12, bulletSp: 640, bombMax: 2, dashCd: 1.6, shape: 0, abil: 'overload' },
  speed: { color: '#ffe066', speed: 400, fireCd: 0.105, lives: 2, hitR: 11, bulletSp: 700, bombMax: 2, dashCd: 1.2, shape: 1, abil: 'blink' },
  tank:  { color: '#8fffb0', speed: 255, fireCd: 0.18,  lives: 4, hitR: 14, bulletSp: 600, bombMax: 3, dashCd: 1.8, shieldStart: 8, shape: 2, abil: 'barrier' },
  nova:  { color: '#ff9be8', speed: 355, fireCd: 0.125, lives: 3, hitR: 12, bulletSp: 665, bombMax: 2, dashCd: 1.45, shape: 3, abil: 'supernova' },
  ghost: { color: '#c9b6ff', speed: 385, fireCd: 0.115, lives: 2, hitR: 11, bulletSp: 690, bombMax: 2, dashCd: 1.1, shape: 4, abil: 'phase' },
  titan: { color: '#ffb060', speed: 245, fireCd: 0.19,  lives: 5, hitR: 15, bulletSp: 590, bombMax: 4, dashCd: 2.0, shieldStart: 10, shape: 5, abil: 'salvo' }
};
/* v7 gemi yetenekleri */
const ABIL = {
  overload:  { cd: 20, dur: 4,   col: '#66e0ff', icon: 'bolt' },
  blink:     { cd: 16, dur: 0.6, col: '#ffe066', icon: 'dash' },
  barrier:   { cd: 24, dur: 4.5, col: '#5cf2b6', icon: 'shield' },
  supernova: { cd: 28, dur: 0.8, col: '#ff9be8', icon: 'star' },

  salvo:     { cd: 26, dur: 0.6, col: '#ffb060', icon: 'rocket' }
};
/* v5 gemi skinleri: govde renkleri + motor isigi */

function shipUpLv(id) { return ((P.shipUp && P.shipUp[S.ship]) || {})[id] | 0; }
function treeCost(id) {
  const tr = TREE.find(x => x.id === id);
  if (!tr) return 0;
  const lv = shipUpLv(id);
  return lv >= tr.max ? 0 : tr.cost[lv];
}
function buyTree(id) {
  const tr = TREE.find(x => x.id === id);
  if (!tr) return;
  const lv = shipUpLv(id);
  if (lv >= tr.max) { sfx.deny(); return; }
  const cost = tr.cost[lv];
  if (P.coins < cost) { sfx.deny(); toast(t('no_coins'), '#ff7bbd'); return; }
  P.coins -= cost;
  if (!P.shipUp[S.ship]) P.shipUp[S.ship] = {};
  P.shipUp[S.ship][id] = lv + 1;
  st = baseStats();
  unlockAch('tree1');
  saveP(); sfx.upgrade();
  toast(t('tree_done'), '#59f0a0');
}

function missDayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function missWeekKey() {
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return 'W' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function pickTasks(pool, n, seed) {
  let a = seed >>> 0;
  const rnd = () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; };
  const p2 = pool.slice(), list = [];
  for (let k = 0; k < n; k++) {
    const it = p2.splice((rnd() * p2.length) | 0, 1)[0];
    list.push({ id: it.id, goal: Math.round(it.min + rnd() * (it.max - it.min)), prog: 0, claimed: false,
      coins: it.coins || 0, dust: it.dust || 0 });
  }
  return list;
}
function missInit(force) {
  let ch = false;
  const day = missDayKey();
  if (force || !P.miss || P.miss.day !== day || !Array.isArray(P.miss.list)) {
    const d = new Date();
    const seed = (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) >>> 0;
    P.miss = { day, list: pickTasks(MISS_POOL, 3, seed) };
    ch = true;
  }
  const wk = missWeekKey();
  if (force || !P.week || P.week.key !== wk || !Array.isArray(P.week.list)) {
    let h = 2166136261;
    for (let i = 0; i < wk.length; i++) { h ^= wk.charCodeAt(i); h = Math.imul(h, 16777619); }
    P.week = { key: wk, list: pickTasks(WPOOL, 3, h >>> 0) };
    ch = true;
  }
  if (ch) saveP();
}
function missAdd(id, n) {
  missInit();
  let ch = false;
  for (const box of [P.miss, P.week]) {
    if (!box || !Array.isArray(box.list)) continue;
    for (const m of box.list) {
      if (m.id !== id || m.claimed || m.prog >= m.goal) continue;
      m.prog = Math.min(m.goal, m.prog + n);
      if (m.prog >= m.goal) {
        ch = true;
        if (state.mode === 'playing') toast(t('miss_complete') + ' — ' + t('miss_' + m.id + '_n'), '#59f0a0');
      }
    }
  }
  if (ch) saveP();
}
function missMax(id, v) {
  missInit();
  let ch = false;
  for (const box of [P.miss, P.week]) {
    if (!box || !Array.isArray(box.list)) continue;
    for (const m of box.list) {
      if (m.id !== id || m.claimed) continue;
      if (v > m.prog) { m.prog = Math.min(m.goal, v); if (m.prog >= m.goal) ch = true; }
    }
  }
  if (ch) saveP();
}
function missClaimable() {
  missInit();
  let n = 0;
  for (const box of [P.miss, P.week])
    if (box && Array.isArray(box.list)) n += box.list.filter(m => !m.claimed && m.prog >= m.goal).length;
  return n;
}
function claimMission(i, kind) {
  missInit();
  const box = kind === 'w' ? P.week : P.miss;
  const m = box && box.list[i];
  if (!m || m.claimed || m.prog < m.goal) { sfx.deny(); return; }
  m.claimed = true;
  const coins = m.coins || 0, dust = m.dust || 0;
  let txt = t('miss_claimed');
  if (coins) { P.coins += coins; txt += ' +' + coins + ' ⛁'; }
  if (dust) { P.dust += dust; P.dustTotal += dust; txt += ' +' + dust + ' ✦'; }
  P.missClaimed = (P.missClaimed || 0) + 1;
  if (P.missClaimed >= 1) unlockAch('mission1');
  if (P.missClaimed >= 9) unlockAch('mission9');
  if (kind === 'w') { P.weeksClaimed = (P.weeksClaimed || 0) + 1; unlockAch('week1'); }
  saveP();
  toast(txt, '#ffd166');
  if (player) addFloat(player.x, player.y - 36, t('miss_claimed'), '#ffd166');
  sfx.upgrade();
}

function baseStats() {
  const b = SHIPS[S.ship];
  const st = Object.assign({}, b);
  st.dmg = 1; st.rateMul = 1; st.speedMul = 1; st.shieldRegen = 0;
  st.magnet = 0; st.comboWin = 2.5; st.comboStep = 0.1; st.graze = 1; st.grazeR = 26;
  st.bossDmg = 1; st.coinMul = 1; st.revive = false;
  st.missilesDur = 0; st.droneDur = 0; st.startWeapon = 1;
  st.rageMul = 1; st.startChip = null;
  st.crit = 0; st.pierce = 0; st.chainR = 0; st.dustWave = 0;
  st.orbit = 0; st.nova = 0; st.leech = 0; st.bulletSlow = 0; st.thorns = 0;
  st.startBomb = false; st.exec = false; st.luckMul = 1; st.abilCdMul = 1;
  if (P.shop.shield) st.shieldStart = Math.max(st.shieldStart || 0, 10);
  if (P.shop.bomb) st.bombMax += 1;
  if (P.shop.magnet) st.magnet += 90;
  if (P.shop.weapon) st.startWeapon = 2;
  if (P.shop.rage) st.rageMul = 1.35;
  if (P.shop.chip) st.startChip = pick(['rear', 'orb', 'bolt']);
  if (P.shop.palgold) st.color = '#ffd85f';
  const shu = (P.shipUp && P.shipUp[S.ship]) || {};
  st.speedMul *= 1 + 0.06 * (shu.spd || 0);
  st.dmg += shu.gun || 0;
  st.lives = Math.min(6, st.lives + (shu.hull || 0));
  st.abilCdMul = 1 - 0.08 * (shu.core || 0);
  st.lives += DIFF[S.diff].lives;
  return st;
}

let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = false; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
const vsfx = v => S.mute ? 0 : v * S.sfx;
const vmus = v => S.mute ? 0 : v * S.music;
function toneAt(freq, dur, type, vol, slideTo, when) {
  if (vol <= 0) return; const ac = audio(); if (!ac) return;
  const t0 = when || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
const tone = (f, d, tp, v, sl) => toneAt(f, d, tp, vsfx(v), sl);
function noiseAt(dur, vol, freq, when) {
  if (vol <= 0) return; const ac = audio(); if (!ac) return;
  const t0 = when || ac.currentTime;
  const len = Math.max(1, Math.floor(ac.sampleRate * dur));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const dd = buf.getChannelData(0);
  for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t0);
  f.frequency.exponentialRampToValueAtTime(120, t0 + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(ac.destination);
  src.start(t0); src.stop(t0 + dur);
}
const noise = (d, v, f) => noiseAt(d, vsfx(v), f);

const mus = { next: 0, beat: 0 };
function musicUpdate() {
  const ac = audio(); if (!ac || S.mute || S.music <= 0) return;
  const now = ac.currentTime;
  if (mus.next < now) mus.next = now + 0.05;
  const boss = state.mode === 'playing' && enemies.some(e => e.type === 'boss');
  const step = state.mode === 'menu' ? 0.32 : boss ? 0.21 : 0.27;
  let guard = 0;
  while (mus.next < now + 0.3 && guard++ < 16) {
    musicBeat(mus.beat, mus.next, boss);
    mus.beat++; mus.next += step;
  }
}
function musicBeat(b, tm, boss) {
  const rShift = [-3, -6, 2, -5, -8][state.region | 0] || 0;
  const root = 110 * Math.pow(2, rShift / 12), prog = [0, -2, -5, -3];
  const p = prog[Math.floor(b / 4) % 4];
  toneAt(root * Math.pow(2, p / 12), 0.24, 'triangle', vmus(0.5), null, tm);
  if (b % 2 === 0) {
    const pent = [0, 3, 5, 7, 10, 12];
    const n = pent[(b * 3 + (b >> 2)) % pent.length];
    toneAt(root * 2 * Math.pow(2, (p + n) / 12), 0.17, 'square', vmus(0.1), null, tm);
  }
  if (b % 4 === 2) noiseAt(0.04, vmus(0.4), 4500, tm);
  if (boss && b % 2 === 1) toneAt(root / 2 * Math.pow(2, p / 12), 0.2, 'sawtooth', vmus(0.3), null, tm);
}

const UI = {
  rects: [], items: [], focus: {}, ctx: 'main',
  begin(c) { this.ctx = c; this.rects = []; this.items = []; },
  get fi() { return this.focus[this.ctx] || 0; },
  set fi(v) { this.focus[this.ctx] = v; },
  row(x, y, w, h, item) {
    item.i = this.items.length; this.items.push(item);
    const i = item.i;
    this.rects.push({ x, y, w, h,
      act: () => { UI.focus[UI.ctx] = i; if (item.act) item.act(); },
      hover: () => { UI.focus[UI.ctx] = i; } });
    return item;
  },
  hit(x, y) {
    for (const r of this.rects) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { r.act(); return true; }
    return false;
  },
  hover(x, y) {
    for (const r of this.rects) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { r.hover(); return; }
  },
  activate() { const it = this.items[this.fi]; if (it && it.act) it.act(); },
  move(d) { const n = this.items.length; if (n) this.focus[this.ctx] = (this.fi + d + n) % n; },
  adjust(d) { const it = this.items[this.fi]; if (it && it.adjust) it.adjust(d); }
};

/* ---------- v7 nova patlamasi ---------- */
function novaBlast(x, y) {
  if ((state.novaDepth || 0) > 2) return;
  state.novaDepth = (state.novaDepth || 0) + 1;
  const R = 72 + 14 * (st.nova || 1);
  fxRing(x, y, 10, 400, 4, 0.45, '#ffd166');
  addShake(2.5);

    if (o.dead || o.type === 'boss' || o.type === 'guard') continue;
    if (dist2(o.x, o.y, x, y) < R*R) hurtEnemy(o, 2 + (st.nova || 1) + (st.dmg - 1) * 0.6, x, y, true);
  }
  for (const r of rocks) if (!r.dead && dist2(r.x, r.y, x, y) < R*R) hurtRock(r, 2);
  state.novaDepth--;
}
/* ---------- hasar ---------- */
function hurtEnemy(e, dmg, sx, sy, quiet) {

  if (e.type === 'shielder' && e.guardUp) { spark(sx, sy, '#9fffcf'); return; }
  if (e.type === 'phantom' && e.faded) { spark(sx, sy, '#cfd6ff'); return; }
  e.hp -= dmg; e.flash = 0.12;
  const execCut = st.exec && e.type !== 'boss' && e.type !== 'guard' &&
    e.hp > 0 && e.maxhp && e.hp <= e.maxhp * 0.16;
  if (execCut) { addFloat(e.x, e.y - 18, 'İNFAZ', '#ff7a9a'); spark(sx, sy, '#ff7a9a'); }
  if (e.hp <= 0 || execCut) { e.dead = true; killEnemy(e); }
  else if (!quiet) sfx.hit();
}
function killEnemy(e) {

  addShake(e.type === 'boss' ? 14 : e.type === 'tank' ? 5 : 2.5);
  state.runKills++; P.kills++;

  state.killN = (state.killN || 0) + 1;
  if (P.kills === 1) unlockAch('first');
  if (P.kills >= 500) unlockAch('kill500');
  if (P.kills >= 1500) unlockAch('kill1500');
  if (st.nova && state.killN % (st.nova >= 2 ? 5 : 6) === 0) novaBlast(e.x, e.y);
  if (st.leech && state.killN % 40 === 0 && state.lives < 6) {
    state.lives++;
    addFloat(e.x, e.y - 24, '+1 ♥', '#ff8fa8');

  }
  addRage(e.type === 'boss' ? 0.25 : e.type === 'guard' ? 0.15 : e.type === 'tank' ? 0.035 : 0.02);

    for (let i = 0; i < 5; i++) spawnCoin(e.x + rand(-40,40), e.y + rand(-20,20));
    spawnCrate(e.x, e.y);

    sfx.bigboom(); addShake(9); slow(0.5, 0.4);

    if (Math.random() < 0.4 * st.coinMul) { spawnCoin(e.x, e.y); if (state.mod === 'gold') spawnCoin(e.x + rand(-16, 16), e.y); }

    Object.assign(e, { r: 15, hp: 2*hpMul, score: 240, vy: 45*dm.spd, x0: s.x, seed: rand(0,TAU), fireT: rand(1.5,2.5), alpha: 1, faded: false });
  else if (type === 'bomber')
    Object.assign(e, { r: 18, hp: 4*hpMul, score: 320, vy: 55*dm.spd, stopY: rand(120,200),

      healT: 1.4, x0: s.x });

    Object.assign(e, { r: 14, hp: 2*hpMul, score: 230, vy: 90*dm.spd, x0: s.x,

/* ---------- dalgalar ---------- */
function buildWave(n) {
  const q = state.spawnQueue = [], dm = DIFF[S.diff];
  state.mod = null;
  let t = 0.4;
  if (S.gmode === 'rush') { q.push({ type: 'boss', t: 1.0, bi: state.bossIdx++ % 5 }); return; }
  if (n % 5 === 0) { q.push({ type: 'boss', t: 1.0 }); return; }
  if (n % 7 === 0) {
    state.mod = 'ast';
    for (let i = 0; i < 12; i++) { q.push({ type: 'rock', t, x: rand(40, W-40) }); t += rand(0.35, 0.7) / dm.spd; }
    t = 1.5;
    for (let i = 0; i < 3; i++) { q.push({ type: 'scout', t, x: rand(55, W-55) }); t += rand(1, 2); }
    return;
  }
  if (n >= 3 && Math.random() < 0.25) state.mod = pick(['gold', 'fog', 'rush']);
  if (n >= 3 && Math.random() < Math.min(0.4, 0.12 + n * 0.02)) q.push({ type: 'guard', t: 0.5 });
  let count = Math.round((4 + n * 2.3) * dm.cnt * (S.gmode === 'endless' ? waveDanger() : 1));
  while (count > 0) {
    const r = Math.random();
    if (r < 0.16 && count >= 5) {
      const cx = rand(120, W-120);
      for (let k = -2; k <= 2; k++) q.push({ type: 'scout', t, x: cx + k*50, y: -30 - Math.abs(k)*28 });
      count -= 5; t += rand(0.9, 1.3);
    } else if (r < 0.28 && count >= 3) {
      const off = rand(20, W-160);
      for (let k = 0; k < 3; k++) q.push({ type: 'diver', t: t + k*0.15, x: off + k*40 + 40 });
      count -= 3; t += rand(0.9, 1.3);
    } else if (r < 0.38 && count >= 6 && n >= 4) {
      for (let k = 0; k < 3; k++) {
        q.push({ type: 'rusher', t: t + k*0.18, x: 50 + k*26 });
        q.push({ type: 'rusher', t: t + k*0.18, x: W - 50 - k*26 });
      }
      count -= 6; t += rand(1.0, 1.5);
    } else {
      let type = 'scout';
      const rr = Math.random();
      if (rr < 0.18) type = 'diver';
      else if (rr < 0.32) type = 'shooter';
      else if (rr < 0.42) type = 'tank';
      else if (rr < 0.54) type = 'splitter';
      else if (rr < 0.64) type = 'orbiter';
      else if (rr < 0.74) type = 'sniper';
      else if (rr < 0.82) type = 'mine';
      else if (rr < 0.90) type = 'rusher';
      else if (rr < 0.96) type = 'shielder';
      else type = 'phantom';
      if (n >= 3 && Math.random() < 0.08) type = 'bomber';
      else if (n >= 4 && Math.random() < 0.10) type = 'weaver';
      else if (n >= 5 && Math.random() < 0.06) type = 'healer';
      if (n < 2) type = 'scout';
      else if (n < 3 && (type === 'sniper' || type === 'tank' || type === 'orbiter' || type === 'rusher' || type === 'shielder' || type === 'phantom')) type = 'shooter';
      else if (n < 4 && (type === 'sniper' || type === 'mine')) type = 'splitter';
      q.push({ type, t, x: rand(55, W-55), elite: Math.random() < 0.1 + Math.min(0.25, n*0.015) });
      count--; t += Math.max(0.15, rand(0.34, 0.8) - n*0.026);
    }
  }
}
function nextWave() {
  state.wave++;
  const n = state.wave;
  state.waveDone = false;
  state.waveDamage = false;
  state.upgradesPending = S.gmode === 'rush' ? (n % 2 === 0) : (n % 3 === 0);
  buildWave(n);
  state.waveTotal = state.spawnQueue.length;
  state.waveKilled0 = state.runKills;
  state.spawnTimer = 0;
  if (st.startBomb && n > 1) state.bombs = Math.min(st.bombMax, state.bombs + 1);
  state.waveBanner = 1.8;
  state.clearT = 0;
  const oldRegion = state.region | 0;
  state.region = regionIdx();
  if (oldRegion !== state.region) {
    state.regionBanner = 2.4;
    if (n > 1) toast(t('region_' + REGIONS[state.region].id), '#9fd8ff');
  }
  sfx.wave();
  if (n >= 10) unlockAch('wave10');
  if (n >= 20) unlockAch('wave20');
}
function waveClear() {
  state.waveDone = true;
  let bonus = Math.round(100 * state.wave * DIFF[S.diff].score);
  state.clearText = t('wave_clear_fmt', { n: fmt(bonus) });

}

    if (!p) continue;
    const d2p = dist2(b.x, b.y, p.x, p.y);
    if (p.barT > 0 && d2p < 56*56) { b.dead = true; spark(b.x, b.y, '#5cf2b6'); continue; }
    const gr = st.grazeR + 8;
    if (!b.g && d2p < gr*gr && d2p > (b.r + p.r)*(b.r + p.r)) {
      b.g = true;
      addScore(2 * st.graze);
      addRage(0.004);
      spark(b.x, b.y, '#aee6ff');
      p.grazeTick -= gdt;
      if (p.grazeTick <= 0) { p.grazeTick = 0.09; sfx.tick(); }
    }
    if (d2p < (b.r + p.r)*(b.r + p.r)) { b.dead = true; damagePlayer(); }
  }
  if (p) for (const m of emissiles) {
    if (m.dead) continue;
    const dm2 = dist2(m.x, m.y, p.x, p.y);
    if (p.barT > 0 && dm2 < 56*56) { killEmissile(m, false); continue; }
    if (dm2 < (m.r + p.r)*(m.r + p.r)) { killEmissile(m, false); damagePlayer(); }
  }
  // gövde çarpışmaları
  if (p) {
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = (e.type === 'boss' ? 44 : e.r) + p.r;
      if (dist2(e.x, e.y, p.x, p.y) < rr*rr) {
        if (p.barT > 0 || p.phT > 0) {
          if (e.type !== 'boss' && e.type !== 'guard') hurtEnemy(e, 3 + 3 * st.thorns, e.x, e.y);
        } else {
          damagePlayer();
          if (e.type !== 'boss') hurtEnemy(e, 2 + 3 * st.thorns, e.x, e.y);
        }
      }
    }
    for (const r of rocks) {
      if (r.dead) continue;
      const rr = r.r + p.r - 4;
      if (dist2(r.x, r.y, p.x, p.y) < rr*rr) {

        else { damagePlayer(); hurtRock(r, 2); }

}
function collidePickups(gdt) {
  const p = player;

  const magR = 90 + st.magnet + (p.magnet > 0 ? 260 : 0);
  for (const pu of powerups) {
    if (pu.dead) continue;
    pu.t += gdt; pu.y += pu.vy*gdt;
    if (pu.y > H + 30) { pu.dead = true; continue; }
    const d = dist2(pu.x, pu.y, p.x, p.y);
    if (d < magR*magR) {
      const dd = Math.sqrt(d) || 1;
      pu.x += (p.x - pu.x)/dd * 260 * gdt;
      pu.y += (p.y - pu.y)/dd * 260 * gdt;
    }
    if (d < (pu.r + p.r + 4)*(pu.r + p.r + 4)) { pu.dead = true; givePower(pu.kind, pu.x, pu.y, pu.chip); }
  }
  for (const c of coins) {
    if (c.dead) continue;
    c.t += gdt;
    c.vy = Math.min(c.vy + 40*gdt, 90);
    c.x += c.vx*gdt; c.y += c.vy*gdt;
    c.vx *= Math.exp(-1.5*gdt);
    if (c.y > H + 20) { c.dead = true; continue; }
    const d = dist2(c.x, c.y, p.x, p.y);
    if (d < magR*magR) {
      const dd = Math.sqrt(d) || 1;
      c.x += (p.x - c.x)/dd * 330 * gdt;
      c.y += (p.y - c.y)/dd * 330 * gdt;
    }
    if (d < 26*26) { c.dead = true; addCoins(1); addScore(5); sfx.coin(); spark(c.x, c.y, CC.coin); }
  }
  for (const c of crates) {
    if (c.dead) continue;
    c.t += gdt; c.y += c.vy*gdt;
    if (c.y > H + 30) { c.dead = true; continue; }
    const d = dist2(c.x, c.y, p.x, p.y);
    if (d < magR*magR) {
      const dd = Math.sqrt(d) || 1;
      c.x += (p.x - c.x)/dd * 300 * gdt;
      c.y += (p.y - c.y)/dd * 300 * gdt;
    }
    if (d < (c.r + p.r + 6)*(c.r + p.r + 6)) { c.dead = true; giveCrate(c); }
  }
}
function filterDead() {
  enemies = enemies.filter(e => !e.dead);
  bullets = bullets.filter(b => !b.dead);
  ebullets = ebullets.filter(b => !b.dead);
  emissiles = emissiles.filter(m => !m.dead);
  missiles = missiles.filter(m => !m.dead);

/* ---------- efekt güncellemeleri ---------- */
function updateStars(dt) {
  for (const s of stars) {
    s.y += (26 + 120 * s.z) * dt * (state.mode === 'playing' ? 1.35 : 0.6);
    if (s.y > H + 2) { s.y = -2; s.x = rand(0, W); }
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx*dt; q.y += q.vy*dt;
    const dr = Math.exp(-2.6*dt);
    q.vx *= dr; q.vy *= dr;
    q.life -= dt;
    if (q.life <= 0) particles.splice(i, 1);
  }
}
function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += r.vr*dt; r.life -= dt;
    if (r.life <= 0) rings.splice(i, 1);
  }
}
function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.x += d.vx*dt; d.y += d.vy*dt;
    d.vy += 160*dt;
    d.rot += d.vr*dt;
    d.life -= dt;
    if (d.life <= 0) debris.splice(i, 1);
  }
}
function updateAfterimages(dt) {
  for (let i = afterimages.length - 1; i >= 0; i--) {
    afterimages[i].life -= dt;
    if (afterimages[i].life <= 0) afterimages.splice(i, 1);
  }
}
function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 34*dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
}
function updateToasts(dt) {
  for (let i = state.toasts.length - 1; i >= 0; i--) {
    state.toasts[i].life -= dt;
    if (state.toasts[i].life <= 0) state.toasts.splice(i, 1);
  }
}
function updateComets(dt) {
  state.cometT -= dt;
  if (state.cometT <= 0) {
    state.cometT = rand(7, 16);
    const spd = rand(500, 800), a = rand(0.35, 0.9) * (Math.random() < 0.5 ? 1 : -1);
    comets.push({ x: rand(0, W), y: -20, vx: Math.sin(a)*spd*0.6, vy: Math.cos(a)*spd, life: 1.4, max: 1.4 });
  }
  for (let i = comets.length - 1; i >= 0; i--) {
    const c = comets[i];
    c.x += c.vx*dt; c.y += c.vy*dt; c.life -= dt;
    if (c.life <= 0 || c.y > H + 40) comets.splice(i, 1);
  }
}

/* ---------- ana güncelleme ---------- */
function update(dt) {
  if (state.hitT > 0) { state.hitT -= dt; dt *= 0.32; }
  state.time += dt;
  updateStars(dt);
  updateParticles(dt);
  updateRings(dt);
  updateDebris(dt);
  updateAfterimages(dt);
  updateFloats(dt);
  updateToasts(dt);
  updateComets(dt);
  state.shake *= Math.exp(-7*dt);
  if (state.shake < 0.12) state.shake = 0;
  if (state.flashA > 0) state.flashA = Math.max(0, state.flashA - dt*2.2);
  if (state.slowT > 0) state.slowT -= dt;
  if (state.zoomT > 0) state.zoomT -= dt;
  if (state.mode === 'over') state.overT += dt;

  if (state.mode !== 'playing') return;

  const ts = state.slowT > 0 ? 1 - (1 - state.slowScale) * Math.min(1, state.slowT / 0.3) : 1;
  const g = dt * ts;
  state.runT += dt;
  if (S.gmode === 'time' && state.runT >= 90) { endTimeRun(); return; }
  P.playtime += dt;
  if (state.waveBanner > 0) state.waveBanner -= dt;
  if (state.regionBanner > 0) state.regionBanner -= dt;
  if (state.clearT > 0) state.clearT -= dt;
  if (state.comboT > 0) { state.comboT -= g; if (state.comboT <= 0) state.combo = 0; }
  if (state.bombCd > 0) state.bombCd -= g;
  if (state.introT > 0) state.introT -= dt;
  state.fever = comboRank() === 'S' ? Math.min(1, state.fever + dt * 2) : Math.max(0, state.fever - dt * 2);
  state.meteorT -= dt;
  if (state.meteorT <= 3.0 && state.meteorWarn === 0) {
    state.meteorWarn = 1;
    state.introT = 1.5;
    state.introName = t('meteor');
    sfx.siren();
  }
  if (state.meteorT <= 0) {
    state.meteorT = rand(26, 40);
    state.meteorWarn = 0;
    if (state.wave > 0 && enemies.length + state.spawnQueue.length < 60) {
      const mn = 4 + Math.min(8, Math.floor(state.wave * 0.6));
      for (let mi = 0; mi < mn; mi++) {
        const rk2 = mkRock(rand(30, W - 30), -30 - rand(0, 160));
        rk2.vx = rand(-55, 55);
        rk2.vy += rand(20, 70);
        rocks.push(rk2);
      }
    }
  }
  for (let i = state.zaps.length - 1; i >= 0; i--) {
    state.zaps[i].life -= dt;
    if (state.zaps[i].life <= 0) state.zaps.splice(i, 1);
  }

  updatePlayer(g);
  updateEnemies(g);
  updateRocks(g);
  updateUfo(g);
  updateBeams(g);
  updateEnemyMissiles(g);
  collideBullets(g);
  collidePickups(g);
  filterDead();

  if (state.betweenWaves > 0) {
    state.betweenWaves -= dt;
    if (state.betweenWaves <= 0) {
      if (state.upgradesPending) openUpgrades();
      else nextWave();
    }
  } else {
    state.spawnTimer += dt;
    while (state.spawnQueue.length && state.spawnQueue[0].t <= state.spawnTimer)
      spawnSpec(state.spawnQueue.shift());
    if (!state.spawnQueue.length && !enemies.length && !rocks.length && !state.waveDone) waveClear();
  }
}

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,190,235,' + (0.22 + 0.18 * Math.sin(e.t * 4 + k)) + ')';
    circle(px, 6, 8);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    circle(px, 6, 2.4);
  }
  // btype aksanları
  if (e.btype === 0) {
    for (const k of [-1, 1]) {
      roundRect(k * 44 - 4, 14, 8, 18, 3);
      ctx.fillStyle = flash ? '#ffffff' : '#2a0a1e'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,160,210,' + (0.5 + 0.3 * Math.sin(e.t * 6 + k)) + ')';
      circle(k * 44, 33, 2.6);
      ctx.restore();
    }
  } else if (e.btype === 1) {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-40, 20); ctx.lineTo(-14, 20);
    ctx.moveTo(14, 20); ctx.lineTo(40, 20);
    ctx.stroke();
  } else if (e.btype === 2) {
    for (const k of [-1, 1]) {
      for (let i = 0; i < 2; i++) {
        ctx.fillStyle = 'rgba(30,10,26,0.95)';
        circle(k * (40 + i * 9), 20, 3.4);
        ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = 'rgba(255,90,90,' + (0.55 + 0.35 * Math.sin(e.t * 7 + i)) + ')';
        circle(k * (40 + i * 9), 20, 1.4);
      }
    }
  } else if (e.btype === 4) {
    // zirh bantlari
    ctx.fillStyle = 'rgba(255,176,96,0.13)';
    roundRect(-48, -10, 96, 11, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,140,0.42)'; ctx.lineWidth = 1;
    ctx.strokeRect(-48, -10, 96, 11);
    // dort taret
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      const tx = sx * 38, ty = sy === -1 ? -23 : 20;
      ctx.fillStyle = '#3a2208';
      circle(tx, ty, 8);
      ctx.strokeStyle = '#ffb060'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(tx, ty, 8, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,200,140,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tx, ty + 4); ctx.lineTo(tx, ty + (sy === 1 ? 15 : 12)); ctx.stroke();
      ctx.fillStyle = 'rgba(255,220,150,' + (0.55 + 0.35 * Math.sin(e.t * 6 + tx)) + ')';
      circle(tx, ty, 2.6);
    }
    // uyari seritleri
    ctx.strokeStyle = 'rgba(255,140,60,0.55)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-31, 27); ctx.lineTo(-19, 27);
    ctx.moveTo(19, 27); ctx.lineTo(31, 27);
    ctx.stroke();
  }
  // dönen çekirdek halkası
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,220,245,0.5)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -2, 24, e.t * 1.4, e.t * 1.4 + 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -2, 24, e.t * 1.4 + Math.PI, e.t * 1.4 + Math.PI + 1.5); ctx.stroke();
  const glow = 0.5 + 0.5 * Math.sin(e.t * 5);
  ctx.fillStyle = queenC ? 'rgba(205,130,255,' + (0.5 + glow * 0.5) + ')' : 'rgba(255,120,190,' + (0.5 + glow * 0.5) + ')';
  circle(0, -2, 15 + glow * 3);
  ctx.fillStyle = '#ffe3f1'; circle(0, -2, 6);
  ctx.restore();
  // antenler
  ctx.fillStyle = col;
  ctx.fillRect(-18, -38, 6, 12);
  ctx.fillRect(12, -38, 6, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  circle(-15, -40, 2); circle(15, -40, 2);
  // alt havalandırma
  ctx.fillStyle = '#1c0620'; ctx.fillRect(-26, 26, 52, 9);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(-20 + i * 13, 27); ctx.lineTo(-20 + i * 13, 34); ctx.stroke();
  }
  if (queenC) {
    ctx.fillStyle = '#ffd85f';
    ctx.beginPath();
    ctx.moveTo(-20, -30); ctx.lineTo(-14, -44); ctx.lineTo(-6, -32);
    ctx.lineTo(0, -48); ctx.lineTo(6, -32); ctx.lineTo(14, -44); ctx.lineTo(20, -30);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5fd2';
    circle(-26, -24, 3); circle(26, -24, 3);
    ctx.strokeStyle = 'rgba(205,130,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-52, -6); ctx.quadraticCurveTo(-70, 18, -56, 34);
    ctx.moveTo(52, -6); ctx.quadraticCurveTo(70, 18, 56, 34);
    ctx.stroke();
  }
  if (shield) {
    ctx.strokeStyle = 'rgba(120,220,255,' + (0.5 + 0.3 * Math.sin(state.time * 10)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 2, 62, 0, TAU); ctx.stroke();
  }
}
function drawRock(r) {
  ctx.save();
  ctx.translate(r.x, r.y); ctx.rotate(r.rot);
  ctx.fillStyle = r.flash > 0 ? '#ffffff' : '#8a7f75';
  ctx.beginPath();
  for (let i = 0; i < r.verts.length; i++) {
    const a = i / r.verts.length * TAU;
    const rr = r.r * r.verts[i];
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6c625a'; circle(-r.r*0.2, -r.r*0.15, r.r*0.35);
  ctx.strokeStyle = '#b7a99b'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function drawUfo() {
  if (!ufo) return;
  ctx.save();
  ctx.translate(ufo.x, ufo.y);
  ctx.fillStyle = ufo.flash > 0 ? '#ffffff' : '#9fd8ff';
  ctx.beginPath(); ctx.ellipse(0, 0, 26, 10, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(200,235,255,0.9)';
  ctx.beginPath(); ctx.ellipse(0, -8, 12, 9, 0, Math.PI, 0); ctx.fill();
  for (let i = -2; i <= 2; i++) {
    ctx.fillStyle = Math.sin(ufo.t*6 + i) > 0 ? '#ffd85f' : '#7fb0d0';
    circle(i*9, 4, 2.4);
  }
  ctx.restore();
}
function drawCrate(c) {
  ctx.save();
  ctx.translate(c.x, c.y); ctx.rotate(Math.sin(c.t*3)*0.15);
  ctx.fillStyle = '#b07c3f'; roundRect(-14, -14, 28, 28, 5); ctx.fill();
  ctx.strokeStyle = '#ffd85f'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#ffe9a8'; ctx.font = '800 18px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 1);
  ctx.restore();
}
function drawCoin(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  const sw = Math.abs(Math.sin(c.t*3));
  ctx.scale(Math.max(0.25, sw), 1);
  ctx.fillStyle = CC.coin; circle(0, 0, 7);
  ctx.fillStyle = '#8a6a1f'; circle(0, 0, 3.5);
  ctx.restore();
}
function drawPowerup(pu) {
  const col = CC[pu.kind] || '#8ff3ff';
  ctx.save();
  ctx.translate(pu.x, pu.y);
  const szp = 1 + 0.08 * Math.sin(pu.t * 6);
  if (!S.rmotion) glowDot(0, 0, 24, col, 0.3);
  ctx.save();
  ctx.rotate(pu.t * 1.6);
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.8;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + Math.PI / 4;
    const px = Math.cos(a) * 13 * szp, py = Math.sin(a) * 13 * szp;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
  const bg = ctx.createRadialGradient(0, -3, 1, 0, 0, 11);
  bg.addColorStop(0, 'rgba(255,255,255,0.8)');
  bg.addColorStop(0.45, 'rgba(34,54,96,0.9)');
  bg.addColorStop(1, 'rgba(8,14,30,0.95)');
  ctx.fillStyle = bg;
  circle(0, 0, 10.5);
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, 10.5, 0, TAU); ctx.stroke();
  const gu = { weapon: 'wave', rapid: 'bolt', shield: 'shield', missile: 'rocket', bomb: 'bomb',
    magnet: 'magnet', drone: 'ship', chip: 'dust', life: 'heart', laser: 'bolt' }[pu.kind] || 'star';
  iconGlyph(0, 0.4, 10.6, gu, col);
  ctx.restore();
}

function drawZaps() {
  const p = player;
  if (p && p.chip === 'orb') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 2; k++) {
      const a = p.orbA + k * Math.PI;
      const ox = p.x + Math.cos(a) * 26, oy = p.y + Math.sin(a) * 26;
      ctx.fillStyle = 'rgba(155,232,255,0.35)'; circle(ox, oy, 9);
      ctx.fillStyle = '#9be8ff'; circle(ox, oy, 4.5);
    }
    ctx.restore();
  }
  if (state.zaps.length) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const z of state.zaps) {
      const a = clamp(z.life / z.max, 0, 1);
      ctx.globalAlpha = a;
      const mx = (z.x1 + z.x2)/2 + rand(-10, 10), my = (z.y1 + z.y2)/2 + rand(-10, 10);
      ctx.strokeStyle = '#c78bff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(z.x1, z.y1); ctx.lineTo(mx, my); ctx.lineTo(z.x2, z.y2); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(z.x1, z.y1); ctx.lineTo(mx, my); ctx.lineTo(z.x2, z.y2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  if (p && state.ultraT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,216,95,' + (0.5 + 0.3*Math.sin(state.time*12)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 30 + Math.sin(state.time*9)*3, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}
function drawMissiles() {
  for (const m of missiles) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI/2);
    ctx.fillStyle = CC.missile;
    ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,5); ctx.lineTo(0,2); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  for (const m of emissiles) {
    ctx.fillStyle = 'rgba(255,110,90,0.9)'; circle(m.x, m.y, 5);
    ctx.fillStyle = '#ffe0c0'; circle(m.x, m.y, 2.2);
  }
}
function drawDrones() {
  const p = player;
  if (!p || p.drones <= 0) return;
  for (let k = 0; k < 2; k++) {
    const a = p.droneA + k*Math.PI;
    const dx = p.x + Math.cos(a)*38, dy = p.y + Math.sin(a)*38;
    ctx.save(); ctx.translate(dx, dy);
    const tgt = nearestEnemy(dx, dy);
    if (tgt) ctx.rotate(Math.atan2(tgt.y - dy, tgt.x - dx));
    ctx.fillStyle = CC.drone;
    ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,-4); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawBeams() {
  for (const b of beams) {
    const y0 = b.src ? b.src.y + 20 : 0;
    if (b.phase === 'warn') {
      const a = (0.18 + 0.12*Math.sin(state.time*20)) * clamp(b.t/0.9 + 0.3, 0, 1);
      ctx.fillStyle = 'rgba(255,60,90,' + a + ')';
      ctx.fillRect(b.x - b.w/2, y0, b.w, H - y0);
      ctx.strokeStyle = 'rgba(255,120,140,0.5)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(b.x - b.w/2, y0, b.w, H - y0);
    } else {
      const g2 = ctx.createLinearGradient(0, y0, 0, H);
      g2.addColorStop(0, 'rgba(255,255,255,0.95)');
      g2.addColorStop(0.3, 'rgba(255,90,150,0.8)');
      g2.addColorStop(1, 'rgba(255,60,120,0.4)');
      ctx.fillStyle = g2;
      ctx.fillRect(b.x - b.w/2, y0, b.w, H - y0);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(b.x - 2.5, y0, 5, H - y0);
    }
  }
}
function drawBulletsFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const fever = state.fever > 0.5;
  for (const b of bullets) {
    ctx.fillStyle = fever ? 'rgba(255,110,220,0.4)' : 'rgba(90,190,255,0.35)';
    circle(b.x, b.y, b.r * 2.4);
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = b.c || '#befff5';
    circle(b.x, b.y + (b.vy < 0 ? b.r * 2.1 : -b.r * 2.1), b.r * 0.75);
    ctx.globalAlpha = 1;
    ctx.fillStyle = b.c || '#befff5';
    circle(b.x, b.y, b.r);
  }
  for (const b of ebullets) {
    ctx.globalAlpha = 0.35; ctx.fillStyle = b.color; circle(b.x, b.y, b.r * 2.3);
    ctx.globalAlpha = 1; circle(b.x, b.y, b.r);
  }
  ctx.restore();
}
function drawParticlesFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const q of particles) {
    const a = clamp(q.life/q.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = q.color;
    circle(q.x, q.y, q.size*(0.4 + a*0.6));
  }
  ctx.restore();
  for (const r of rings) {
    ctx.globalAlpha = clamp(r.life/r.max, 0, 1);
    ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const d of debris) {
    ctx.globalAlpha = clamp(d.life/d.max, 0, 1);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.sides; i++) {
      const ang = i/d.sides*TAU;
      const px = Math.cos(ang)*d.size, py = Math.sin(ang)*d.size;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life/f.max, 0, 1);
    ctx.fillStyle = f.color;
    ctx.font = '700 14px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ---------- çizim: HUD ---------- */
function drawHUD() {
  const p = player;
  if (!p) return;
  ctx.textBaseline = 'top';
  panel(12, 10, 150, 40, 13, { c1: 'rgba(24,38,74,0.66)', c2: 'rgba(10,16,36,0.72)' });
  ctx.fillStyle = TH.mut;
  ctx.font = '700 9px system-ui, "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(t('hud_score'), 24, 15);
  ctx.fillStyle = '#f2faff';
  ctx.font = '800 19px system-ui, "Segoe UI", sans-serif';
  ctx.fillText(fmt(state.score), 24, 26);
  {
    const bhx = 26, bhw = 122;
    const lf = clamp(state.lives / 6, 0, 1);
    ctx.beginPath(); roundRect(bhx, 54, bhw, 5, 2.5);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
    if (lf > 0.01) {
      ctx.beginPath(); roundRect(bhx, 54, bhw * lf, 5, 2.5);
      const lg2 = ctx.createLinearGradient(bhx, 0, bhx + bhw, 0);
      lg2.addColorStop(0, lf > 0.34 ? '#63e6a0' : '#ff6b7f');
      lg2.addColorStop(1, lf > 0.34 ? '#3fbf86' : '#ff9a5c');
      ctx.fillStyle = lg2;
      if (!S.rmotion) { ctx.shadowColor = lf > 0.34 ? 'rgba(90,240,170,0.6)' : 'rgba(255,110,130,0.65)'; ctx.shadowBlur = 7; }
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    iconGlyph(17, 56.5, 5.4, 'heart', lf > 0.34 ? '#7effc0' : '#ff8899');
    const sf = clamp((p.shield || 0) / 10, 0, 1);
    ctx.beginPath(); roundRect(bhx, 63, bhw, 4, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
    if (sf > 0.01) {
      ctx.beginPath(); roundRect(bhx, 63, bhw * sf, 4, 2);
      ctx.fillStyle = '#5cf2b6';
      if (!S.rmotion) { ctx.shadowColor = 'rgba(90,242,182,0.7)'; ctx.shadowBlur = 6; }
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    iconGlyph(17, 65, 4.8, 'shield', sf > 0.01 ? '#7de8c0' : 'rgba(125,232,192,0.4)');
  }
  const cTxt = fmt(P.coins);
  ctx.font = '800 12px system-ui, "Segoe UI", sans-serif';
  const cwP = ctx.measureText(cTxt).width + 44;
  panel(W - 12 - cwP, 10, cwP, 26, 13, { c1: 'rgba(38,32,10,0.62)', c2: 'rgba(18,14,6,0.75)' });
  iconGlyph(W - 12 - cwP + 15, 23, 7, 'coin', TH.gold);
  ctx.fillStyle = '#ffe9a8';
  ctx.textAlign = 'left';
  ctx.fillText(cTxt, W - 12 - cwP + 29, 17);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(139,163,192,0.85)';
  ctx.font = '700 10px system-ui, "Segoe UI", sans-serif';
  ctx.fillText(t('best_fmt', { n: fmt(P.best) }), W - 15, 42);
  const tLeft = Math.max(0, 90 - state.runT);
  const tStr = Math.floor(tLeft / 60) + ':' + String(Math.floor(tLeft % 60)).padStart(2, '0');
  const wTxt = S.gmode === 'time' ? t('hud_time', { n: tStr }) : t('hud_wave', { n: state.wave || 1 });
  ctx.font = '800 12px system-ui, "Segoe UI", sans-serif';
  const wwP = ctx.measureText(wTxt).width + 28;
  pill(W / 2 - wwP / 2, 11, wwP, 24, wTxt,
    S.gmode === 'time' && tLeft < 15 ? '#ff8899' : '#bfe9ff',
    { border: S.gmode === 'time' ? 'rgba(255,180,110,0.4)' : 'rgba(120,200,255,0.35)' });
  {
    const wp = clamp((state.runKills - (state.waveKilled0 || 0)) / Math.max(1, state.waveTotal || 1), 0, 1);
    const pbw = wwP - 12;
    ctx.beginPath(); roundRect(W / 2 - pbw / 2, 32, pbw, 3, 1.5);
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
    if (wp > 0.02) {
      ctx.beginPath(); roundRect(W / 2 - pbw / 2, 32, pbw * wp, 3, 1.5);
      const pbg = ctx.createLinearGradient(W / 2 - pbw / 2, 0, W / 2 + pbw / 2, 0);
      pbg.addColorStop(0, '#5bd7ff'); pbg.addColorStop(1, '#a9dcff');
      ctx.fillStyle = pbg; ctx.fill();
    }
  }
  if (state.mod) {
    const mlab = { ast: 'mod_ast', gold: 'mod_gold', fog: 'mod_fog', rush: 'mod_rush' }[state.mod] || 'mod_ast';
    const mCol = state.mod === 'gold' ? TH.gold : state.mod === 'rush' ? '#ff9a5c' : '#d8c6a8';
    ctx.font = '800 10px system-ui, "Segoe UI", sans-serif';
    const mwP = ctx.measureText(t(mlab)).width + 22;
    pill(W / 2 - mwP / 2, 41, mwP, 18, t(mlab), mCol, { fs: '800 10px system-ui, "Segoe UI", sans-serif' });
  }
  if (S.gmode === 'endless' && state.wave > 20) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff7b8f';
    ctx.font = '800 11px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(t('danger_fmt', { n: waveDanger().toFixed(1) }), W / 2, state.mod ? 63 : 41);
    ctx.textAlign = 'left';
  }
  const boss = enemies.find(e => e.type === 'boss');
  const guard = !boss ? enemies.find(e => e.type === 'guard' && e.entered) : null;
  const hb = boss || guard;
  const hbShow = !!(hb && (boss ? boss.entered : true));
  if (hbShow) {
    const bw = W - 88, bx = 44, by = 76;
    const hc = boss ? CC.boss : '#ffb060';
    const nm = boss ? t('boss_' + ['spread', 'laser', 'missile', 'queen', 'fortress'][boss.btype] || 'spread') : t('boss_guard');
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd7ec';
    ctx.font = '800 11px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(nm.split('').join(' ') + (hb.phase === 2 ? '  ·  II' : ''), W / 2, 62);
    ctx.beginPath(); roundRect(bx, by, bw, 10, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
    const frac = clamp(hb.hp / hb.maxhp, 0, 1);
    if (frac > 0) {
      ctx.save();
      ctx.beginPath(); roundRect(bx, by, bw * frac, 10, 5); ctx.clip();
      const bg2 = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      bg2.addColorStop(0, hc); bg2.addColorStop(1, boss && boss.btype === 3 ? '#b06bff' : '#ff8ad0');

      ctx.globalAlpha = 0.18; ctx.fillStyle = col; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = col;
      ctx.font = '800 13px system-ui, "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const cbw = 150;

  for (let i = 0; i < state.lives; i++) drawShipIcon(20 + i * 20, H - 20, 0.52, st.color);

  if (p.missiles > 0) badges.push([t('p_missile') + ' ' + p.missiles.toFixed(1), CC.missile, 'rocket']);
  if (p.laser > 0) badges.push([t('p_laser') + ' ' + p.laser.toFixed(1), CC.laser, 'flame']);
  if (p.drones > 0) badges.push([t('p_drone') + ' ' + p.drones.toFixed(1), CC.drone, 'ship']);
  if (p.magnet > 0) badges.push([t('p_magnet') + ' ' + p.magnet.toFixed(1), CC.magnet, 'magnet']);

  {

  const rf = state.ultraT > 0 ? clamp(state.ultraT / 6, 0, 1) : clamp(state.rage, 0, 1);

  if (rf > 0) {

      gradText(wbTxt, W / 2, 286, '800 36px system-ui, "Segoe UI", sans-serif', '#8fe0ff', '#f0fbff', '#3aa0ff');
      ctx.strokeStyle = 'rgba(120,200,255,0.5)'; ctx.lineWidth = 1.5;

      ctx.moveTo(W / 2 - wbW / 2 - 40, 274); ctx.lineTo(W / 2 - wbW / 2 - 12, 274);
      ctx.moveTo(W / 2 + wbW / 2 + 12, 274); ctx.lineTo(W / 2 + wbW / 2 + 40, 274);
      ctx.stroke();
      if (state.mod) {
        const mlab2 = { ast: 'mod_ast', gold: 'mod_gold', fog: 'mod_fog', rush: 'mod_rush' }[state.mod] || 'mod_ast';
        const mCol2 = state.mod === 'gold' ? TH.gold : state.mod === 'rush' ? '#ff9a5c' : '#d8c6a8';

  if (state.regionBanner > 0) {

  }
  if (state.clearT > 0) {

  }
  if (state.introT > 0) {
    ctx.globalAlpha = clamp(Math.min(state.introT, 0.4) / 0.4, 0, 1);
    const bandY = 198, bandH = 56;
    const ig = ctx.createLinearGradient(0, bandY, 0, bandY + bandH);
    ig.addColorStop(0, 'rgba(255,60,110,0.04)');
    ig.addColorStop(0.5, 'rgba(255,60,110,0.2)');
    ig.addColorStop(1, 'rgba(255,60,110,0.04)');
    ctx.fillStyle = ig; ctx.fillRect(0, bandY, W, bandH);
    ctx.strokeStyle = 'rgba(255,110,160,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, bandY); ctx.lineTo(W, bandY);
    ctx.moveTo(0, bandY + bandH); ctx.lineTo(W, bandY + bandH);
    ctx.stroke();
    gradText(state.introName, W / 2, bandY + 39, '800 26px system-ui, "Segoe UI", sans-serif', '#ff9ec8', '#fff0f6', '#ff2f7a');
    ctx.globalAlpha = 1;
  }
  if (state.runT < 10 && state.wave <= 1 && !touchDevice) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(160,200,235,' + clamp(10 - state.runT, 0, 1) * 0.85 + ')';
    ctx.font = '700 12px system-ui, "Segoe UI", sans-serif';
    ctx.fillText(t('hint_line'), W / 2, H - 104);
  }
  ctx.textBaseline = 'top';
}

/* ---------- dokunmatik kontroller ---------- */
function touchButtons() {
  return [
    { x: W - 58, y: H - 168, r: 32, act: doDash, label: '»' },
    { x: W - 58, y: H - 88, r: 32, act: useBomb, label: 'B' },
    { x: W - 130, y: H - 88, r: 30, act: useUltra, label: 'U' },
    { x: W - 130, y: H - 168, r: 30, act: useAbil, label: 'E' }
  ];
}
function drawTouch() {
  if (!touchDevice || state.mode !== 'playing') return;
  if (joy.on) {
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 46, 0, TAU);
    ctx.fillStyle = 'rgba(20,34,64,0.25)'; ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
    const kx = joy.ox + joy.vx * 34, ky = joy.oy + joy.vy * 34;
    glowDot(kx, ky, 26, 'rgba(90,230,255,0.5)', 0.8);
    ctx.beginPath(); ctx.arc(kx, ky, 16, 0, TAU);
    const kg = ctx.createRadialGradient(kx - 4, ky - 4, 2, kx, ky, 16);
    kg.addColorStop(0, 'rgba(220,250,255,0.95)');
    kg.addColorStop(1, 'rgba(70,150,230,0.75)');
    ctx.fillStyle = kg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.4; ctx.stroke();
  }
  const btns = touchButtons();
  const bicons = ['dash', 'bomb', 'bolt', (ABIL[(SHIPS[S.ship] || {}).abil] || ABIL.overload).icon];
  for (let bi = 0; bi < btns.length; bi++) {
    const b = btns[bi];
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
    const bg = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 2, b.x, b.y, b.r);
    bg.addColorStop(0, 'rgba(42,64,110,0.8)');
    bg.addColorStop(1, 'rgba(10,16,34,0.85)');
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = 'rgba(150,220,255,0.35)'; ctx.lineWidth = 1.6; ctx.stroke();
    iconGlyph(b.x, b.y, b.r * 0.42, bicons[bi], bi === 1 ? '#ffcf5f' : (bi === 2 ? '#ffd166' : (bi === 3 ? (ABIL[(SHIPS[S.ship] || {}).abil] || ABIL.overload).col : '#cfefff')));
  }
  ctx.textBaseline = 'top';
  if (player && player.dashT > 0) {
    ctx.strokeStyle = 'rgba(255,216,95,0.9)'; ctx.lineWidth = 3;
    const prog = 1 - player.dashT / st.dashCd;
    ctx.beginPath(); ctx.arc(btns[0].x, btns[0].y, btns[0].r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * prog); ctx.stroke();
  }
  pill(btns[1].x + 8, btns[1].y + 10, 36, 18, 'x' + state.bombs, '#ffcf5f',
    { fs: '800 11px system-ui, "Segoe UI", sans-serif', fill: 'rgba(40,30,6,0.8)', border: 'rgba(255,209,102,0.4)' });
  if (player) {
    const ab = btns[3], A = ABIL[(SHIPS[S.ship] || {}).abil] || ABIL.overload;
    const full = A.cd * (st.abilCdMul || 1);
    if (player.abilT > 0) {
      ctx.strokeStyle = 'rgba(180,205,235,0.6)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ab.x, ab.y, ab.r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - player.abilT / full)); ctx.stroke();
    } else if (player.barT > 0 || player.phT > 0 || player.ovT > 0) {
      ctx.strokeStyle = A.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ab.x, ab.y, ab.r + 2, 0, TAU); ctx.stroke();
    } else {
      ctx.strokeStyle = A.col; ctx.lineWidth = 3;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(state.time * 7);
      ctx.beginPath(); ctx.arc(ab.x, ab.y, ab.r + 2, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  const ub = btns[2];
  if (state.ultraT > 0) {
    ctx.strokeStyle = '#ffd85f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ub.x, ub.y, ub.r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(state.ultraT / 6, 0, 1)); ctx.stroke();
  } else if (state.rage >= 1) {
    ctx.strokeStyle = 'rgba(255,216,95,' + (0.6 + 0.4 * Math.sin(state.time * 7)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ub.x, ub.y, ub.r + 2, 0, TAU); ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,216,95,0.45)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(ub.x, ub.y, ub.r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(state.rage, 0, 1)); ctx.stroke();
  }
}

/* ---------- ekran efektleri ---------- */
function drawEffects() {
  if (vinC) ctx.drawImage(vinC, 0, 0, W, H);
  if (state.mode === 'playing' && state.mod === 'fog' && !S.rmotion) {
    ctx.fillStyle = 'rgba(6,10,20,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = 0.2;
    for (let i = 0; i < 3; i++) {
      const fx = W * (0.5 + 0.45 * Math.sin(state.time * 0.3 + i * 2.1));
      const fy = H * (0.45 + 0.4 * Math.cos(state.time * 0.23 + i * 1.7));
      const fg = ctx.createRadialGradient(fx, fy, 20, fx, fy, 240);
      fg.addColorStop(0, 'rgba(190,215,240,0.55)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }
  if (state.mode === 'playing' && state.lives <= 1 && redC && !S.rmotion) {
    ctx.globalAlpha = 0.45 + 0.3*Math.sin(state.time*5);
    ctx.drawImage(redC, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (state.flashA > 0.01) {
    ctx.globalAlpha = clamp(state.flashA, 0, 0.85);
    ctx.fillStyle = state.flashCol;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (S.scan && scanP) {
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = scanP;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (S.fps) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(160,200,235,0.8)';
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillText(Math.round(state.fps) + ' FPS', W - 14, 34);
  }
  let ty = 84;
  for (const tst of state.toasts) {
    const a = clamp(Math.min(tst.life, tst.max - tst.life) * 3, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '700 12px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(tst.text).width + 22;
    ctx.fillStyle = 'rgba(8,22,18,0.8)';
    roundRect(14, ty, w, 24, 6); ctx.fill();
    ctx.strokeStyle = tst.color; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = tst.color;
    ctx.fillText(tst.text, 25, ty + 12);
    ctx.textBaseline = 'top';
    ty += 30;
    ctx.globalAlpha = 1;
  }
}

/* ---------- ana çizim ---------- */
function drawFrame() {
  const m = 6, L = 30;
  ctx.save();
  ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(105,205,255,0.45)';
  if (!S.rmotion) { ctx.shadowColor = 'rgba(90,190,255,0.75)'; ctx.shadowBlur = 9; }
  const cs = [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]];
  for (const c of cs) {
    ctx.beginPath();
    ctx.moveTo(c[0], c[1] + c[3] * L);
    ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0] + c[2] * L, c[1]);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(85,165,255,0.14)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(m, m + L + 10); ctx.lineTo(m, H - m - L - 10);
  ctx.moveTo(W - m, m + L + 10); ctx.lineTo(W - m, H - m - L - 10);
  ctx.moveTo(m + L + 10, m); ctx.lineTo(W - m - L - 10, m);
  ctx.moveTo(m + L + 10, H - m); ctx.lineTo(W - m - L - 10, H - m);
  ctx.stroke();
  ctx.restore();
}
function render() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackground();
  ctx.save();
  const z = state.zoomT > 0
    ? 1 + (state.zoomAmt - 1) * Math.sin(Math.PI * clamp(state.zoomT / state.zoomDur, 0, 1)) : 1;
  if (z !== 1) { ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2); }
  if (state.shake > 0.12) ctx.translate(rand(-1,1)*state.shake, rand(-1,1)*state.shake);
  for (const c of crates) drawCrate(c);
  for (const c of coins) drawCoin(c);
  for (const pu of powerups) drawPowerup(pu);
  for (const r of rocks) drawRock(r);
  for (const e of enemies) drawEnemy(e);
  drawUfo();
  drawBeams();
  drawBulletsFx();
  drawMissiles();
  drawDrones();
  drawZaps();
  if (state.mode !== 'menu') drawPlayer();
  drawParticlesFx();
  ctx.restore();
  drawFrame();
  if ((state.mode === 'playing' || state.mode === 'paused' || state.mode === 'over' || state.mode === 'upgrade') && player) drawHUD();
  drawTouch();
  drawEffects();
  if (state.mode === 'menu') renderMenu();
  else if (state.mode === 'paused') renderPause();
  else if (state.mode === 'over') renderOver();
  else if (state.mode === 'upgrade') renderUpgrade();
}

/* ---------- menü çizimi ---------- */
function paintMenuBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(6,10,26,0.8)');
  g.addColorStop(0.5, 'rgba(4,7,18,0.72)');
  g.addColorStop(1, 'rgba(10,6,26,0.84)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function menuTitle(text) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  gradText(text, W / 2, 60, '800 30px system-ui, "Segoe UI", sans-serif', '#7fd8ff', '#c9b3ff', '#2f9dff');

  addRow(260, t('m_resume'), null, { h: 48, cta: true, icon: 'play', center: true, fs: 16 }, { act: resumeGame });
